<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>project-hub</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0E1013; --p:#13161B; --p2:#1A1E25; --line:#2A2F38; --line2:#3A404B;
  --text:#D7DBE2; --dim:#A0A8B5; --faint:#7A8190;
  --amber:#FFB547; --cyan:#6CD3E8; --green:#8BD47C; --red:#FF7A7A; --violet:#C29BFF; --blue:#7AB6FF;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.55 var(--mono);min-height:100vh;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
[hidden]{display:none!important}

.bar{display:flex;align-items:stretch;background:var(--p);border-bottom:1px solid var(--line);min-height:34px;flex-wrap:wrap}
.bar>*{display:flex;align-items:center;padding:0 14px;border-right:1px solid var(--line)}
.bar .logo{background:var(--amber);color:#14110A;font-weight:700;border:0;font-size:13px;line-height:inherit}
.bar .tab{color:var(--dim)}
.bar .tab kbd{color:var(--faint);margin-right:6px;font:inherit}
.bar .tab.on{color:var(--text);background:var(--bg);box-shadow:inset 0 -2px 0 var(--amber)}
.bar .sp{flex:1;border:0;padding:0}
.bar .st{color:var(--dim);gap:8px}
.bar .st b{color:var(--green);font-weight:400}
.bar .st.off b{color:var(--red)}
.bar .st .u{color:var(--amber)}

main{flex:1;padding:22px 24px 30px;min-width:0}
.view{display:none}
body[data-view=overview] #overview, body[data-view=project] #project{display:block}

.pane{border:1px solid var(--line);position:relative;padding:18px 16px 14px;margin-bottom:22px;background:var(--bg);min-width:0}
.pane>.lbl{font:inherit;position:absolute;top:-10px;left:12px;background:var(--bg);padding:0 8px;color:var(--amber);display:flex;gap:10px;max-width:calc(100% - 24px)}
.pane>.lbl span{color:var(--dim)}
.pane>.rt{position:absolute;top:-10px;right:12px;background:var(--bg);padding:0 8px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.pane>.rt button{color:var(--dim)}
.pane>.rt button:hover{color:var(--text)}
.pane>.rt button.on{color:var(--text)}
.pane>.rt button.on::before{content:"[";color:var(--amber)} .pane>.rt button.on::after{content:"]";color:var(--amber)}

.prompt{color:var(--dim);margin-bottom:14px}
.prompt b{color:var(--green);font-weight:400}
.prompt i{font-style:normal;color:var(--text)}
.caret{display:inline-block;width:8px;height:15px;background:var(--amber);vertical-align:-3px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.caret{animation:none}*{transition:none!important}}

.tag{display:inline-block;min-width:62px;color:var(--c)}
.tag::before{content:"● "}
.s-active{--c:var(--green)} .s-paused{--c:var(--amber)} .s-parked{--c:var(--violet)} .s-done{--c:var(--blue)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:400;color:var(--faint);padding:0 14px 8px 0;border-bottom:1px solid var(--line);text-transform:uppercase;font-size:11.5px;letter-spacing:.06em;white-space:nowrap}
td{padding:11px 14px 11px 0;border-bottom:1px solid #1C2027;vertical-align:top;white-space:nowrap}
tr.row{cursor:pointer}
tr.row:hover td,tr.row.sel td{background:var(--p)}
tr.row.sel td:first-child{box-shadow:inset 2px 0 var(--amber)}
td.name{color:var(--text);font-weight:700}
td.name a:hover{color:var(--amber)}
td.name small{display:block;font-weight:400;color:var(--faint);font-size:11.5px}
td.nx{white-space:normal;color:var(--text);min-width:220px;max-width:380px}
td.dim{color:var(--dim)}
.pb{display:inline-block;width:160px;height:14px;background:#262B33;vertical-align:-2px}
.pb i{display:block;height:100%;background:var(--c)}
.frac{color:var(--dim);margin-left:8px}
.ph{color:var(--text)} .ph small{color:var(--faint);font-size:11.5px;margin-left:6px}
.inb{color:var(--faint)}
.inb.has{color:var(--bg);background:var(--amber);padding:0 6px;font-weight:700}
.legend{display:flex;gap:22px;color:var(--faint);margin-top:14px;font-size:12px;flex-wrap:wrap}
.empty{color:var(--faint);padding:8px 0}
.empty::before{content:"# ";color:var(--line2)}

.phead{display:flex;gap:6px 22px;align-items:baseline;margin-bottom:22px;flex-wrap:wrap}
.phead h2{font-size:22px;font-weight:700;color:var(--text)}
.phead .k{color:var(--faint)} .phead .v{color:var(--text)}
.phead .nx{color:var(--amber)}

.cues{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0}
.cue{border:1px solid var(--line);margin:0 0 -1px -1px;padding:10px 12px;position:relative;min-height:112px;display:flex;flex-direction:column;min-width:0}
.cue .main{display:flex;flex-direction:column;justify-content:flex-start;text-align:left;width:100%;flex:1} /* a stretched button centres its content; pin it to the top so labels align */
.cue .n{color:var(--faint);font-size:11.5px;display:flex;justify-content:space-between}
.cue h4{font-size:13.5px;margin:4px 0;color:var(--text);font-weight:700}
.cue p{color:var(--dim);font-size:12px;line-height:1.45;white-space:normal}
.cue .s{font-size:11.5px}
.cue.done .s{color:var(--green)} .cue.done h4{color:var(--dim)}
.cue.todo .s{color:var(--faint)}
.cue.in_progress{background:color-mix(in srgb,var(--amber) 8%,var(--bg));border-color:var(--amber);z-index:1}
.cue.in_progress .s{color:var(--amber)}
.cue.in_progress::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--amber)}
.cue.sel{box-shadow:inset 0 0 0 1px var(--amber);z-index:2}
.cue .selst{color:var(--dim);font-size:11.5px;margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.cue .selst button{color:var(--dim)} .cue .selst button:hover{color:var(--text)}
.cue .selst button.on{color:var(--amber)}
.cue .selst button.on::before{content:"["} .cue .selst button.on::after{content:"]"}

.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:22px;align-items:start}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0}
.kc{border-right:1px solid var(--line);padding:0 14px;min-width:0}
.kc:first-child{padding-left:0} .kc:last-child{border-right:0;padding-right:0}
.kc h4{font-size:.83em;font-weight:400;color:var(--dim);border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:6px;display:flex}
.kc h4 b{color:var(--text);font-weight:700;margin-right:8px}
.kc h4 span,.kc h4 button{margin-left:auto;color:var(--faint)}
.kc h4 button:hover{color:var(--amber)}
.it{display:grid;grid-template-columns:1fr auto;padding:2px 4px;border-left:2px solid transparent;position:relative}
.it:hover,.it:focus-within{background:var(--p);border-left-color:var(--line2)}
.it.sel{background:var(--p);border-left-color:var(--amber)}
.it .itbtn{display:grid;grid-template-columns:18px 1fr;gap:0 6px;padding:4px 0;min-width:0}
.it .ty{font-weight:700;color:var(--c)}
.it .t{color:var(--text);white-space:normal;line-height:1.4;overflow-wrap:anywhere}
.it .id{grid-column:2;color:var(--faint);font-size:11.5px}
.it .det{grid-column:2;color:var(--dim);font-size:12px;white-space:normal;overflow-wrap:anywhere}
.it .ia{display:none;gap:6px;align-items:flex-start;padding-top:4px}
.it:hover .ia,.it:focus-within .ia,.it.sel .ia{display:flex}
.it .ia button{color:var(--dim);padding:0 3px;border:1px solid var(--line)}
.it .ia button:hover:not(:disabled){color:var(--amber);border-color:var(--amber)}
.ty-bug{--c:var(--red)} .ty-idea{--c:var(--cyan)} .ty-future_request{--c:var(--violet)}
.kc.dn .t,.kc.dc .t{color:var(--dim)}
.kc.dc .t{text-decoration:line-through}

.dl{display:grid;grid-template-columns:100px 1fr;gap:2px 16px}
.dl time{color:var(--faint)}
.dl .d{color:var(--text);overflow-wrap:anywhere}
.dl .r{grid-column:2;color:var(--dim);margin-bottom:10px;overflow-wrap:anywhere}
.dl .r::before{content:"└ because ";color:var(--faint)}

.feed .m{padding:10px 0;border-bottom:1px solid #1C2027}
.feed .m.sel{box-shadow:-2px 0 var(--amber)}
.feed .h{display:flex;gap:8px;color:var(--faint);font-size:12px;flex-wrap:wrap}
.feed .h .k{font-weight:700}
.feed .h .acts{margin-left:auto;display:flex;gap:10px}
.feed .h .acts button{color:var(--dim)} .feed .h .acts button:hover{color:var(--amber)}
.feed .ti{color:var(--text);margin-top:2px;overflow-wrap:anywhere}
.feed .bd{color:var(--dim);white-space:pre-wrap;overflow-wrap:anywhere}
.m.msg .k{color:var(--cyan)}
.m.task .k{color:var(--violet)}
.m.task .ti::before{content:"[ ] ";color:var(--violet)}
.m.task.done .ti::before{content:"[x] "}
.m.unread .ti{font-weight:700}
.m.unread .h .stt::before{content:"●";color:var(--amber)}
.m.read .ti,.m.done .ti{color:var(--dim)}
.m.report{background:var(--p);border:1px solid var(--line);border-left:3px solid var(--amber);padding:10px 12px;margin:8px 0}
.m.report .k{color:var(--bg);background:var(--amber);padding:0 5px}
.m.report pre{font:inherit;color:var(--text);margin-top:6px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}
.m.report.read pre,.m.report.done pre{color:var(--dim)}
.m.report pre .ok{color:var(--green)} .m.report pre .no{color:var(--red)} .m.report pre .ar{color:var(--amber)}

.cmd{border:1px solid var(--line);padding:7px 10px;margin-top:10px;color:var(--dim)}
.cmd>button{color:var(--dim)} .cmd>button b{color:var(--amber);font-weight:400}
.frm{display:grid;gap:8px;margin-bottom:14px;border:1px dashed var(--line2);padding:12px}
.cmd .frm{border:0;padding:8px 0 0;margin:0}
.frm label{display:grid;gap:2px;color:var(--dim);font-size:12px}
.frm label em{color:var(--amber);font-style:normal}
.frm .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frm input,.frm select,.frm textarea{background:var(--p);border:1px solid var(--line);color:var(--text);font:inherit;padding:5px 8px;min-width:0;width:100%}
.frm textarea{resize:vertical;min-height:64px}
.frm .btns{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.frm .btns button{color:var(--bg);background:var(--amber);padding:0 10px;font-weight:700}
.frm .btns button[type=button]{background:none;color:var(--dim);font-weight:400;padding:0}
.frm .btns button:disabled{opacity:.5}
.ferr{color:var(--red);font-size:12px}

#toasts{position:fixed;right:16px;bottom:48px;display:grid;gap:8px;z-index:10;max-width:min(520px,calc(100vw - 32px))}
.toast{background:var(--p2);border:1px solid var(--line2);border-left:3px solid var(--amber);padding:8px 12px;display:flex;gap:12px;overflow-wrap:anywhere}
.toast.err{border-left-color:var(--red)} .toast.err b{color:var(--red)}
.toast.ok b{color:var(--green)}
.toast button{margin-left:auto;color:var(--dim)}

.rt button,.acts button,.kc h4 button,.selst button,.keys button{padding:4px 5px;margin:-4px -5px}
.kc h4 button{margin:-4px -5px -4px auto}
#phead h2:focus{outline:none} /* programmatic focus target, not interactive */
.it .ia button{min-width:24px;min-height:24px;text-align:center}
.feed .h .k{position:relative}
.feed .h .k::after{content:"";position:absolute;inset:-4px -3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.keys{border-top:1px solid var(--line);background:var(--p);padding:7px 24px;color:var(--dim);display:flex;gap:10px 22px;font-size:12px;flex-wrap:wrap}
.keys button:hover{color:var(--text)}
.keys kbd{font:inherit;color:var(--bg);background:var(--dim);padding:0 5px;margin-right:6px}

@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)} main{padding:22px 14px 30px} .keys{padding:7px 14px}}
</style>
</head>
<body data-view="overview">
<header class="bar">
  <h1 class="logo">project-hub</h1>
  <a class="tab" id="tab-ov" href="#overview"><kbd>1</kbd>overview</a>
  <a class="tab" id="tab-pr" href="#overview" hidden><kbd>2</kbd><span></span></a>
  <span class="sp"></span>
  <span class="st"><span class="u" id="unread">0 unread</span></span>
  <span class="st" id="sync"><b>●</b> <span>127.0.0.1:8765 · poll 5s · --:--:--</span></span>
</header>

<main>
<div class="view" id="overview">
  <div class="prompt"><b>danny@hub</b> ~ $ <i>list_projects</i> <span class="caret"></span></div>
  <section class="pane">
    <h2 class="lbl">projects <span id="ov-count"></span></h2>
    <span class="rt" id="ov-filter"></span>
    <div class="tw"><table>
      <thead><tr><th>status</th><th>project</th><th>current phase</th><th>progress</th><th>next step</th><th>inbox</th><th>updated</th></tr></thead>
      <tbody id="ov-body"></tbody>
    </table></div>
    <div class="empty" id="ov-empty" hidden></div>
    <div class="legend"><span><b style="color:var(--green);font-weight:400">█</b> done</span><span><b style="color:#262B33;font-weight:400">█</b> to do</span><span style="margin-left:auto">enter = open · ↑↓ = select</span></div>
  </section>
</div>

<div class="view" id="project">
  <div class="phead" id="phead"></div>

  <section class="pane">
    <h3 class="lbl">phases <span id="ph-count"></span></h3>
    <span class="rt">space = cycle status</span>
    <div class="cues" id="cues"></div>
  </section>

  <div class="cols">
    <div style="min-width:0">
      <section class="pane">
        <h3 class="lbl">items <span id="it-count"></span></h3>
        <span class="rt" id="chips"></span>
        <form class="frm" id="f-item" hidden novalidate>
          <div class="row2">
            <label>type<select name="type"><option value="bug">bug</option><option value="idea">idea</option><option value="future_request">future_request</option></select></label>
            <label>title <em>(required)</em><input name="title" required maxlength="200"></label>
          </div>
          <label>details<textarea name="details"></textarea></label>
          <div class="btns"><button type="submit">Add item</button><button type="button" data-cancel>Cancel</button><span class="ferr" aria-live="polite"></span></div>
        </form>
        <div class="kb" id="board"></div>
      </section>
      <section class="pane">
        <h3 class="lbl">decisions <span id="dec-count"></span></h3>
        <div class="dl" id="decs"></div>
      </section>
    </div>

    <section class="pane feed">
      <h3 class="lbl">inbox <span id="in-count"></span></h3>
      <div id="msgs"></div>
      <div class="cmd">
        <button type="button" id="msg-open" aria-expanded="false"><b>post msg ›</b> <span>Post message (m)</span></button>
        <form class="frm" id="f-msg" hidden novalidate>
          <div class="row2">
            <label>to<select name="to"></select></label>
            <label>kind<select name="kind"><option value="message">message</option><option value="task">task</option><option value="report">report</option></select></label>
          </div>
          <label>title <em>(required)</em><input name="title" required maxlength="200"></label>
          <label>body <em>(required)</em><textarea name="body" required></textarea></label>
          <div class="btns"><button type="submit">Post message</button><button type="button" data-cancel>Cancel</button><span class="ferr" aria-live="polite"></span></div>
        </form>
      </div>
    </section>
  </div>
</div>
</main>

<div id="toasts" aria-live="polite"></div>

<nav class="keys" aria-label="shortcuts">
  <button data-k="1" aria-label="overview"><kbd>1</kbd>overview</button>
  <button data-k="2" aria-label="project"><kbd>2</kbd>project</button>
  <button data-k="a" aria-label="add item"><kbd>a</kbd>add item</button>
  <button data-k="ArrowLeft" aria-label="move selected item left"><kbd>←</kbd>move left</button>
  <button data-k="ArrowRight" aria-label="move selected item right"><kbd>→</kbd>move right</button>
  <button data-k="m" aria-label="post message"><kbd>m</kbd>post message</button>
  <button data-k="r" aria-label="mark read"><kbd>r</kbd>mark read</button>
  <button data-k="d" aria-label="mark done"><kbd>d</kbd>mark done</button>
  <button data-k="x" aria-label="show discarded"><kbd>x</kbd>show discarded</button>
</nav>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const h = (tag, props, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  e.append(...kids.flat(Infinity).filter((x) => x != null && x !== false)); // strings become text nodes, never HTML
  return e;
};
const fill = (el, ...kids) => el.replaceChildren(...kids.flat().filter((x) => x != null && x !== false));

const STATUSES = ["active", "paused", "parked", "done"];
const COLS = ["open", "planned", "done"];
const TYPE = { bug: ["B", "bug"], idea: ["I", "idea"], future_request: ["F", "future"] };
const PHASE_ST = ["todo", "in_progress", "done"];
const PH_SYM = { todo: "○", in_progress: "▶", done: "✓" };
const S = { focusNext: false, projects: [], d: null, pid: null, last: null, filter: "all", ovSel: 0, sel: null, tf: "all", disc: false, offline: false, key: "" };

function ago(iso) {
  const m = (Date.now() - new Date(iso).getTime()) / 60000;
  if (!(m >= 1)) return "now";
  const hr = m / 60, d = hr / 24;
  if (m < 60) return Math.floor(m) + "m";
  if (hr < 24) return Math.floor(hr) + "h";
  if (d < 7) return Math.floor(d) + "d";
  if (d < 30) return Math.floor(d / 7) + "w";
  if (d < 365) return Math.floor(d / 30) + "mo";
  return Math.floor(d / 365) + "y";
}

/* ---------- API + toasts ---------- */
function toast(text, kind) {
  const t = h("div", { class: "toast " + kind }, h("b", {}, kind === "err" ? "error" : "ok"), h("span", {}, text),
    h("button", { type: "button", "aria-label": "dismiss", onclick: () => t.remove() }, "×"));
  $("#toasts").append(t);
  setTimeout(() => t.remove(), kind === "err" ? 10000 : 3500);
}
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  let j = null;
  try { j = await r.json(); } catch (e) { /* non-JSON body */ }
  if (!r.ok) {
    let msg = j && j.error;
    if (!msg && j && Array.isArray(j.detail)) msg = j.detail.map((x) => (x.loc || []).slice(1).join(".") + ": " + x.msg).join("; ");
    throw new Error(msg || "The hub sent an unexpected response. Reload the page.");
  }
  return j;
}
// run a write, toast errors, refresh; returns true on success
async function act(fn, okText, errEl) {
  try {
    await fn();
    if (okText) toast(okText, "ok");
    await refresh(true);
    return true;
  } catch (e) {
    if (errEl) errEl.textContent = e.message;
    toast(e.message, "err");
    return false;
  }
}

/* ---------- data ---------- */
async function refresh(force) {
  try {
    const [list, unread] = await Promise.all([api("GET", "/api/projects"), api("GET", "/api/unread")]);
    S.unread = unread.count;
    let d = null;
    if (S.pid) d = await api("GET", "/api/projects/" + encodeURIComponent(S.pid));
    S.offline = false;
    const key = JSON.stringify([list, d]);
    S.projects = list; S.d = d;
    if (S.pid && !d) return;
    syncBar();
    if (force || key !== S.key) { S.key = key; render(); }
  } catch (e) {
    if (S.pid && /^unknown /.test(e.message)) { toast(e.message, "err"); S.pid = null; S.last = null; location.hash = "#overview"; return; }
    S.offline = true;
    syncBar();
  }
}
function syncBar() {
  $("#sync").className = "st" + (S.offline ? " off" : "");
  $("#sync").lastChild.textContent = S.offline ? "Can't reach the hub at 127.0.0.1:8765. Retrying every 5 s. " : "127.0.0.1:8765 · poll 5s · " + new Date().toTimeString().slice(0, 8);
  $("#unread").textContent = (S.unread || 0) + " unread";
}

/* ---------- render ---------- */
function render() {
  const a = document.activeElement, fk = a && a.dataset && a.dataset.fk;
  document.body.dataset.view = S.pid ? "project" : "overview";
  $("#tab-ov").classList.toggle("on", !S.pid);
  $("#tab-pr").classList.toggle("on", !!S.pid);
  const pid = S.pid || S.last;
  $("#tab-pr").hidden = !pid;
  if (pid) { $("#tab-pr").href = "#p/" + encodeURIComponent(pid); $("#tab-pr span").textContent = (S.projects.find((p) => p.id === pid) || { name: pid }).name; }
  S.pid ? renderProject() : renderOverview();
  if (S.focusNext) {
    const t = S.pid ? (S.d && S.d.id === S.pid && $("#phead h2")) : document.querySelector("tr.sel a");
    if (t) { t.focus(); S.focusNext = false; }
  } else if (fk) { const n = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if (n) n.focus(); }
}
const visibleProjects = () => S.projects.filter((p) => S.filter === "all" || p.status === S.filter);
const COLOR = { active: "green", paused: "amber", parked: "violet", done: "blue" };

function renderOverview() {
  const ps = S.projects;
  const cnt = STATUSES.map((s) => [s, ps.filter((p) => p.status === s).length]).filter((x) => x[1]).map((x) => `${x[1]} ${x[0]}`);
  $("#ov-count").textContent = [ps.length, ...cnt].join(" · ");
  fill($("#ov-filter"), ["all", ...STATUSES].map((f) => h("button", { type: "button", class: S.filter === f ? "on" : "", "aria-pressed": S.filter === f, onclick: () => { S.filter = f; S.ovSel = 0; render(); } }, f)));
  const vis = visibleProjects();
  S.ovSel = Math.min(S.ovSel, Math.max(0, vis.length - 1));
  $("#ov-empty").hidden = vis.length > 0;
  $("#ov-empty").textContent = ps.length ? "No projects with this status." : "No projects yet. Create one from Claude with create_project.";
  fill($("#ov-body"), vis.map((p, i) => h("tr", { class: `row s-${p.status}` + (i === S.ovSel ? " sel" : ""), onclick: (e) => { S.ovSel = i; if (!e.target.closest("a")) open(p.id); } },
    h("td", {}, h("span", { class: "tag" }, p.status)),
    h("td", { class: "name" }, h("a", { href: "#p/" + encodeURIComponent(p.id), "data-fk": "r" + p.id }, p.name), h("small", {}, p.description)),
    h("td", { class: "ph" }, p.current_phase || "-", p.current_phase ? h("small", { title: `Phase ${p.current_phase_pos} of ${p.phases_total}` }, `${p.current_phase_pos}/${p.phases_total}`) : null),
    h("td", {}, h("span", { class: "pb", style: `--c:var(--${COLOR[p.status]})`, role: "img", "aria-label": `${p.phases_done} of ${p.phases_total} phases done` },
      h("i", { style: `width:${p.phases_total ? (100 * p.phases_done) / p.phases_total : 0}%` })), h("span", { class: "frac" }, `${p.phases_done}/${p.phases_total}`)),
    h("td", { class: "nx", style: p.next_step ? "" : "color:var(--faint)" }, p.next_step || "-"),
    h("td", {}, h("span", { class: "inb" + (p.unread_count ? " has" : ""), "aria-label": p.unread_count + " unread" }, p.unread_count || "-")),
    h("td", { class: "dim" }, ago(p.updated_at)))));
}

function renderProject() {
  const d = S.d;
  if (!d || d.id !== S.pid) return;
  const items = d.items, inbox = d.inbox;
  fill($("#phead"), h("h2", { tabindex: "-1" }, d.name), h("span", { class: "tag s-" + d.status }, d.status),
    d.repo_path ? h("span", {}, h("span", { class: "k" }, "repo "), h("span", { class: "v" }, d.repo_path)) : null,
    h("span", {}, h("span", { class: "k" }, "next → "), h("span", { class: "nx" }, d.next_step || "-")));

  $("#ph-count").textContent = `${d.phases.filter((p) => p.status === "done").length}/${d.phases.length} done`;
  fill($("#cues"), d.phases.length ? d.phases.map((p, i) => {
    const sel = S.sel && S.sel.kind === "phase" && S.sel.id === p.id;
    return h("div", { class: `cue ${p.status}` + (sel ? " sel" : "") },
      h("button", { type: "button", class: "main", "data-fk": "ph" + p.id, "aria-pressed": sel, onclick: () => { S.sel = { kind: "phase", id: p.id }; render(); } },
        h("span", { class: "n" }, h("span", {}, String(i + 1).padStart(2, "0")), h("span", { class: "s" }, `${PH_SYM[p.status]} ${p.status.replace("_", " ")}`)),
        h("h4", {}, p.name), h("p", {}, p.notes || "")),
      sel ? h("div", { class: "selst" }, "status:", PHASE_ST.map((s) => h("button", { type: "button", class: p.status === s ? "on" : "", onclick: () => setPhase(p.id, s) }, s))) : null);
  }) : h("div", { class: "empty" }, "No phases yet. Add them from Claude with add_phase."));

  const live = items.filter((i) => i.status !== "discarded"), disc = items.filter((i) => i.status === "discarded");
  const n = (t) => live.filter((i) => i.type === t).length;
  $("#it-count").textContent = `${live.length} · B bug ${n("bug")} · I idea ${n("idea")} · F future request ${n("future_request")}`;
  fill($("#chips"), [["all", "all"], ["bug", "bug"], ["idea", "idea"], ["future_request", "future"]].map(([f, l]) =>
    h("button", { type: "button", class: S.tf === f ? "on" : "", "aria-pressed": S.tf === f, onclick: () => { S.tf = f; render(); } }, l)),
    h("button", { type: "button", "aria-pressed": S.disc, onclick: toggleDisc }, `${S.disc ? "-" : "+"}discarded(${disc.length})`));
  const cols = S.disc ? [...COLS, "discarded"] : COLS;
  fill($("#board"), cols.map((c) => {
    const its = colItems(c);
    const idx = COLS.indexOf(c);
    return h("div", { class: "kc " + (c === "done" ? "dn" : c === "discarded" ? "dc" : "") },
      h("h4", {}, h("b", {}, c), String(its.length), c === "open" ? h("button", { type: "button", "aria-label": "add item", onclick: () => openForm("item") }, "[a]dd") : h("span", {}, c === "planned" ? "→ move" : c === "done" ? "✓" : "")),
      its.length ? its.map((it) => {
        const sel = S.sel && S.sel.kind === "item" && S.sel.id === it.id, [L, name] = TYPE[it.type];
        const mv = (st, lab, txt) => h("button", { type: "button", title: lab, "aria-label": `${lab}: ${it.title}`, onclick: () => setItem(it.id, st) }, txt);
        return h("div", { class: `it ty-${it.type}` + (sel ? " sel" : ""), "data-id": it.id },
          h("button", { type: "button", class: "itbtn", "data-fk": "i" + it.id, "aria-pressed": sel, onclick: () => { S.sel = { kind: "item", id: it.id }; render(); } },
            h("span", { class: "ty", title: name }, L), h("span", { class: "t" }, it.title),
            h("span", { class: "id" }, `${name} · #${it.id.slice(0, 8)} · ${ago(it.created_at)}`), it.details && sel ? h("span", { class: "det" }, it.details) : null),
          h("span", { class: "ia" },
            c === "discarded" ? mv("open", "Restore to open", "↺") : [idx > 0 ? mv(COLS[idx - 1], "Move to " + COLS[idx - 1], "←") : null, idx < 2 ? mv(COLS[idx + 1], "Move to " + COLS[idx + 1], "→") : null,
              mv("discarded", "Discard item", "✕")]));
      }) : h("div", { class: "empty" }, c === "open" ? "No open items. Press a to add one." : c === "discarded" ? "No discarded items." : `No ${c} items.`));
  }));

  $("#dec-count").textContent = d.decisions.length;
  fill($("#decs"), d.decisions.length ? [...d.decisions].reverse().flatMap((x) => [h("time", {}, x.date.slice(0, 10)), h("span", { class: "d" }, x.decision), h("span", { class: "r" }, x.reason)]) : h("div", { class: "empty", style: "grid-column:1/-1" }, "No decisions logged yet."));

  const unread = inbox.filter((m) => m.status === "unread").length;
  $("#in-count").textContent = `${unread} unread / ${inbox.length}`;
  fill($("#msgs"), inbox.length ? inbox.map((m) => {
    const sel = S.sel && S.sel.kind === "msg" && S.sel.id === m.id, cls = { message: "msg", task: "task", report: "report" }[m.kind];
    const body = m.kind === "report" ? h("pre", {}, m.body.split("\n").map((ln, i) => {
      const c = { "+": "ok", "-": "no", "→": "ar", ">": "ar" }[ln[0]];
      return [i ? "\n" : "", c ? h("span", { class: c }, ln[0]) : null, c ? ln.slice(1) : ln];
    })) : h("div", { class: "bd" }, m.body);
    return h("div", { class: `m ${cls} ${m.status}` + (sel ? " sel" : ""), "data-id": m.id },
      h("div", { class: "h" }, h("button", { type: "button", class: "k", "data-fk": "m" + m.id, title: "Select message", "aria-pressed": sel, onclick: () => { S.sel = { kind: "msg", id: m.id }; render(); } }, m.kind === "message" ? "MSG" : m.kind.toUpperCase()),
        h("span", {}, `${m.from_project} → ${m.to_project} · ${ago(m.created_at)} · `, m.status === "unread" ? h("span", { class: "stt" }, h("span", { class: "sr" }, "unread")) : h("span", { class: "stt" }, m.status)),
        h("span", { class: "acts" },
          m.status === "unread" ? h("button", { type: "button", title: "Mark read", "aria-label": "Mark read", onclick: () => setMsg(m.id, "read") }, "[r]ead") : null,
          m.status !== "done" ? h("button", { type: "button", title: "Mark done", "aria-label": "Mark done", onclick: () => setMsg(m.id, "done") }, "[d]one") : null)),
      h("div", { class: "ti" }, m.title), body);
  }) : h("div", { class: "empty" }, "Inbox is empty."));

  const to = $("#f-msg [name=to]"), cur = to.value;
  fill(to, h("option", { value: d.id }, "this project (" + d.id + ")"), h("option", { value: "all" }, "all"));
  to.value = cur === "all" ? "all" : d.id;
}
function colItems(c) {
  return S.d.items.filter((i) => i.status === c && (S.tf === "all" || i.type === S.tf)).sort((a, b) => b.created_at.localeCompare(a.created_at));
}

/* ---------- actions ---------- */
const open = (id) => { location.hash = "#p/" + encodeURIComponent(id); };
const setPhase = (id, status) => act(() => api("POST", `/api/projects/${S.pid}/phases/${id}`, { status }), "Phase set to " + status);
const setItem = (id, status) => act(() => api("PATCH", `/api/projects/${S.pid}/items/${id}`, { status }), "Item moved to " + status);
const setMsg = (id, status) => act(() => api("PATCH", `/api/messages/${id}`, { status }), "Message marked " + status);
function toggleDisc() { S.disc = !S.disc; render(); }
function syncExp() { $("#msg-open").setAttribute("aria-expanded", String(!$("#f-msg").hidden)); }
function openForm(which) {
  const f = $(which === "item" ? "#f-item" : "#f-msg");
  f.hidden = false; syncExp();
  f.querySelector("[name=title]").focus();
  f.scrollIntoView({ block: "nearest" });
}
function closeForm(f) { f.hidden = true; syncExp(); }
function bindForm(f, send, okText) {
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = f.querySelector("[type=submit]"), err = f.querySelector(".ferr"), v = Object.fromEntries(new FormData(f));
    err.textContent = "";
    const empty = [...f.querySelectorAll("[required]")].find((x) => !x.value.trim());
    if (empty) { err.textContent = `${empty.name[0].toUpperCase() + empty.name.slice(1)} is required.`; empty.focus(); return; }
    btn.disabled = true;
    const ok = await act(() => send(v), okText, err);
    btn.disabled = false;
    if (!ok) { const w = (err.textContent.match(/\b(title|body|details|type|kind)\b/) || [])[1]; (f.querySelector(`[name=${w}]`) || f.querySelector("[name=title]")).focus(); }
    if (ok) { f.querySelectorAll("[name=title],[name=details],[name=body]").forEach((x) => (x.value = "")); closeForm(f); }
  });
  f.querySelector("[data-cancel]").addEventListener("click", () => closeForm(f));
  f.addEventListener("keydown", (e) => { if (e.key === "Escape") closeForm(f); });
}
bindForm($("#f-item"), (v) => api("POST", `/api/projects/${S.pid}/items`, { type: v.type, title: v.title, details: v.details }), "Item added");
bindForm($("#f-msg"), (v) => api("POST", "/api/messages", { to_project: v.to, kind: v.kind, title: v.title, body: v.body }), "Message posted");
$("#msg-open").addEventListener("click", () => ($("#f-msg").hidden ? openForm("msg") : closeForm($("#f-msg"))));

/* ---------- keyboard ---------- */
function step(dir) {
  if (!S.pid) {
    const n = visibleProjects().length;
    if (n) { S.ovSel = Math.max(0, Math.min(n - 1, S.ovSel + dir)); render(); const r = document.querySelector("tr.sel"); if (r) r.scrollIntoView({ block: "nearest" }); }
    return;
  }
  const fl = S.d ? (S.disc ? [...COLS, "discarded"] : COLS).flatMap(colItems) : [];
  if (!fl.length) return;
  const i = S.sel && S.sel.kind === "item" ? fl.findIndex((x) => x.id === S.sel.id) : -1;
  S.sel = { kind: "item", id: fl[Math.max(0, Math.min(fl.length - 1, i + dir))].id };
  render();
  const n = document.querySelector(".it.sel"); if (n) n.scrollIntoView({ block: "nearest" });
}
function key(k, target) {
  const inBtn = target && target.closest && target.closest("button,a");
  if (k === "1") { location.hash = "#overview"; return; }
  if (k === "2") { const p = S.pid || S.last || (visibleProjects()[S.ovSel] || {}).id; if (p) open(p); return; }
  if (k === "ArrowUp") return step(-1);
  if (k === "ArrowDown") return step(1);
  if (k === "Enter") { if (!S.pid && !inBtn) { const p = visibleProjects()[S.ovSel]; if (p) open(p.id); } return; }
  if (!S.pid || !S.d) return;
  const sel = S.sel;
  if (k === "a") return openForm("item");
  if (k === "m") return openForm("msg");
  if (k === "x") return toggleDisc();
  if (k === " ") { if (sel && sel.kind === "phase" && !inBtn) { const p = S.d.phases.find((x) => x.id === sel.id); if (p) setPhase(p.id, PHASE_ST[(PHASE_ST.indexOf(p.status) + 1) % 3]); } return; }
  if (k === "ArrowLeft" || k === "ArrowRight") {
    const it = sel && sel.kind === "item" && S.d.items.find((x) => x.id === sel.id);
    if (!it) { toast("Select an item first: use ↑↓ or click one.", "err"); return; }
    if (it.status === "discarded") return k === "ArrowLeft" ? setItem(it.id, "open") : undefined;
    const to = COLS[COLS.indexOf(it.status) + (k === "ArrowRight" ? 1 : -1)];
    return to ? setItem(it.id, to) : undefined;
  }
  if (k === "r" || k === "d") {
    let m = sel && sel.kind === "msg" && S.d.inbox.find((x) => x.id === sel.id);
    if (!m) m = S.d.inbox.find((x) => x.status === "unread");
    if (!m) { toast("No unread message to mark.", "err"); return; }
    return setMsg(m.id, k === "r" ? "read" : "done");
  }
}
addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (!["1", "2", "a", "m", "r", "d", "x", " ", "Enter", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) return;
  if (e.key === "a" || e.key === "m" || e.key.startsWith("Arrow") || (e.key === " " && !e.target.closest("button,a"))) e.preventDefault();
  key(e.key, e.target);
});
document.querySelectorAll(".keys [data-k]").forEach((b) => b.addEventListener("click", () => key(b.dataset.k)));

/* ---------- routing ---------- */
function route() {
  const m = location.hash.match(/^#p\/(.+)$/);
  const pid = m ? decodeURIComponent(m[1]) : null;
  if (pid !== S.pid) {
    S.pid = pid; S.sel = null; S.d = null; S.key = "";
    if (pid) S.last = pid;
    else { const i = visibleProjects().findIndex((x) => x.id === S.last); if (i >= 0) S.ovSel = i; }
    S.focusNext = true;
    for (const f of [$("#f-item"), $("#f-msg")]) { f.hidden = true; f.reset(); f.querySelector(".ferr").textContent = ""; }
    syncExp();
  }
  refresh(true);
}
addEventListener("hashchange", route);
route();
setInterval(() => refresh(false), 5000);
</script>
</body>
