<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>project-hub</title>
<link rel="icon" href="data:,">
<style>
/* "Briefing" design system, see design-system/MASTER.md */
:root{
  --bg:#0E1013;--p:#13161B;--p2:#1A1E25;--line:#2A2F38;--line2:#3A404B;
  --text:#D7DBE2;--dim:#A0A8B5;--faint:#7A8190;
  --amber:#FFB547;--green:#8BD47C;--violet:#C29BFF;--blue:#7AB6FF;--cyan:#6CD3E8;--red:#FF7A7A;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,ui-monospace,monospace;
  --amberbg:#1C1912;--r:6px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--sans);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:3px}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
[hidden]{display:none!important}
h1,h2,h3,p,ul,ol{margin:0}
.mono{font-family:var(--mono);font-size:.88em}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.wrap{overflow-wrap:anywhere;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);min-height:46px;display:flex;align-items:center;gap:4px;padding:0 32px;flex-wrap:wrap}
.brand{font:700 13px var(--mono);color:var(--amber);margin-right:18px}
.nav{display:flex;gap:2px;min-width:0;flex-wrap:wrap}
.nav a{padding:6px 12px;border-radius:var(--r);color:var(--dim);white-space:nowrap;font-size:14px}
.nav a:hover{color:var(--text);background:var(--p)}
.nav a[aria-current="page"]{color:var(--text);background:var(--p2);box-shadow:inset 0 -2px 0 var(--amber)}
.nav .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:1px}
.top .right{margin-left:auto;font-size:13px;color:var(--dim);display:flex;gap:14px;white-space:nowrap;flex-wrap:wrap}
.top .right .u{color:var(--amber);font-weight:600}
.st b{color:var(--green);font-weight:400} .st.off b{color:var(--red)}
.st{white-space:normal}

main{flex:1;width:100%;max-width:1380px;margin:0 auto;padding:26px 32px 48px;min-width:0}
.view{display:none}
body[data-view=overview] #overview, body[data-view=project] #project{display:block}

.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 10px}
.status{font-size:13px;white-space:nowrap}
.status::before{content:"●";margin-right:5px}
.s-active{color:var(--green)} .s-paused{color:var(--amber)} .s-parked{color:var(--violet)} .s-done{color:var(--blue)}
.track{display:flex;gap:2px;height:6px;width:100%;max-width:420px}
.track i{flex:1;border-radius:2px;background:#262B33}
.track i.d{background:var(--green)} .track i.c{background:var(--amber)}

.btn{display:inline-flex;align-items:center;min-height:28px;padding:2px 12px;border:1px solid var(--line2);border-radius:var(--r);color:var(--text);font-size:14px;white-space:nowrap;text-align:center;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
.btn.go{background:var(--c,var(--amber));border-color:var(--c,var(--amber));color:var(--bg);font-weight:700}
.btn.go:hover:not(:disabled){color:var(--bg);filter:brightness(1.1)}
.btn.sm{min-height:24px;padding:0 9px;font-size:13px}
.btn.quiet{border-color:var(--line);color:var(--dim)}

/* attention callouts */
.att{display:grid;gap:8px}
.call{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:var(--r);background:var(--p);padding:9px 14px;min-width:0;--c:var(--amber)}
.call.gate-review{--c:var(--violet)} .call.gate-manual_test{--c:var(--amber)}
.call .crow{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.call .ctext{flex:1 1 260px;min-width:0}
.call .cacts{display:flex;gap:8px;flex-wrap:wrap}
.call .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin-right:10px;white-space:nowrap}
.call .t{font-weight:600}
.call .why{color:var(--dim);font-size:14px;margin-top:1px}
.call details>summary{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
.call details>summary .more{margin-left:auto;font-size:13px;color:var(--dim);white-space:nowrap}
.call details[open]>summary .more::after{content:" ▴"} .call details:not([open])>summary .more::after{content:" ▾"}
.call.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.body{white-space:pre-wrap;color:var(--text);font-size:14px;margin:8px 0 2px;padding-top:8px;border-top:1px solid var(--line);max-height:320px;overflow:auto;overflow-wrap:anywhere}
.body .ok{color:var(--green)} .body .no{color:var(--red)} .body .ar{color:var(--amber)}
.body .mk{display:flex;gap:8px;margin-top:8px}
.calm{color:var(--green);font-size:14px}

/* inline confirmation */
.cf{margin-top:8px;border:1px solid var(--amber);border-radius:var(--r);background:var(--amberbg);padding:10px 14px}
.cf p{font-size:14.5px;overflow-wrap:anywhere}
.cf .btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* overview */
.lead{font-size:20px;line-height:1.45;margin:0 0 6px;max-width:980px}
.lead b{font-weight:600}
.ovsub{color:var(--dim);margin:0 0 18px;font-size:14px;display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap}
.flt{display:flex;gap:6px;flex-wrap:wrap}
.flt button,.chip-b{font-size:13px;border:1px solid var(--line2);border-radius:999px;padding:1px 11px;min-height:24px;color:var(--dim);white-space:nowrap}
.flt button:hover,.chip-b:hover{color:var(--text)}
.flt button.on,.chip-b.on{border-color:var(--amber);color:var(--amber)}
.projs{display:grid;gap:12px}
.proj{border:1px solid var(--line);border-radius:var(--r);padding:14px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:6px 36px;cursor:pointer}
.proj.hot{border-color:var(--line2)}
.proj.sel{border-color:var(--line2);background:var(--p);box-shadow:inset 3px 0 0 var(--amber)}
.proj h2{font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.proj h2 a:hover{text-decoration:underline;text-decoration-color:var(--amber)}
.proj .sum{margin-top:6px}
.proj .sum b{font-weight:600}
.proj .nxt{margin-top:4px;color:var(--dim);font-size:14.5px}
.proj .nxt span{color:var(--text)}
.proj .meta{display:flex;gap:16px;align-items:center;margin-top:12px;font-size:13px;color:var(--faint)}
.proj .meta .track{flex:1}
.proj .side{display:grid;gap:8px;align-content:start}
.proj .side .call{padding:6px 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:13px;border:1px solid var(--line2);border-radius:999px;padding:2px 10px;color:var(--dim);white-space:nowrap}
.res{margin-top:26px;color:var(--dim);font-size:14px}
.res ul{padding:0;list-style:none;display:grid;gap:8px;margin-top:6px}
.res li{display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.res li .tx{overflow-wrap:anywhere;min-width:0}
.res .cf{flex-basis:100%}

/* project */
.ph-head{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin:0 0 4px}
.ph-head h2{font-size:26px;font-weight:650;letter-spacing:-.01em}
.ph-head h2:focus{outline:none}
.ph-head .back{font-size:13px;color:var(--dim);margin-left:auto}
.ph-head .back:hover{color:var(--text)}
.ph-head .aut,.ph-head .desc{flex-basis:100%;color:var(--dim);font-size:14px;max-width:900px;overflow-wrap:anywhere}
.ph-head .repo{font-size:13px;color:var(--dim);overflow-wrap:anywhere;min-width:0}
.ph-head{margin-bottom:14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:40px;align-items:start}
.brief{margin:0 0 12px;font-size:18px;line-height:1.45}
.brief p{margin:0 0 4px}
.brief b{font-weight:600}
.brief .k{color:var(--dim)}
.brief .att-line{font-weight:600;margin-top:6px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:10px}
.sec-h .eyebrow{margin:0}
.sec-h .chips{margin:0 0 0 auto}

/* timeline */
.tl{position:relative;padding:0;list-style:none}
.tl::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--line)}
.tl>li{position:relative;padding-left:32px;min-width:0}
.tl>li::before{content:"";position:absolute;left:2px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line2)}
.tl>li.done::before{background:var(--green);border-color:var(--green)}
.tl>li.cur::before{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--amber)}
.tl>li.sel::before{border-color:var(--amber)}
.tl .donesum{padding:2px 0 12px}
.tl .donesum>summary{color:var(--green);font-size:14.5px;display:inline-block}
.tl .donesum>summary .ar{color:var(--dim);margin-left:4px;display:inline-block}
.tl .donesum[open]>summary .ar{transform:rotate(90deg)}
.tl .donelist{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:2px}
.n{font-family:var(--mono);font-size:12.5px;color:var(--faint)}
.pe{border:1px solid transparent;border-radius:var(--r);padding:6px 12px 8px;margin-bottom:6px;--c:var(--amber)}
.pe.g-review{--c:var(--violet)} .pe.g-manual_test{--c:var(--amber)}
.pe .pmain{display:block;width:100%}
.pe .nm{font-size:15px;color:var(--text);display:block;overflow-wrap:anywhere}
.pe.st-done .nm{color:var(--dim)}
.pe .nm .n{margin-right:8px}
.pe .nt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;color:var(--dim);margin-top:1px;white-space:pre-wrap;overflow-wrap:anywhere}
.pe.sel .nt,.pe.cur .nt{display:block;-webkit-line-clamp:unset;overflow:visible}
.pe.cur .nt{font-size:15px;color:var(--text)}
.pe.cur{background:var(--amberbg);border-color:#4A3B22;padding:12px 18px 14px;margin-bottom:16px}
.pe .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);font-weight:700;display:block}
.pe .lbl .n{color:var(--dim);letter-spacing:0;margin-left:6px}
.pe .cn{display:block;font-size:21px;font-weight:600;line-height:1.3;margin:2px 0 4px;overflow-wrap:anywhere}
.pe.sel{background:var(--p2);border:2px solid var(--amber);padding:5px 11px 7px;box-shadow:0 0 0 3px rgba(255,181,71,.18)}
.pe.cur.sel{background:var(--amberbg);padding:11px 17px 13px}
.selb{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--amber);border-radius:4px;padding:0 6px;margin-left:8px;vertical-align:2px}
.pe .pacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.g{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--c);color:var(--c);border-radius:4px;padding:0 6px;margin-left:8px;vertical-align:2px;white-space:nowrap;font-family:var(--sans)}
.g.review{--c:var(--violet)} .g.manual_test{--c:var(--amber)} .g.ok{--c:var(--green)}
.gr{font-size:13.5px;color:var(--dim);margin-top:2px;display:block;overflow-wrap:anywhere}
.gr::before{content:"gate · ";color:var(--faint)}
.selst{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;color:var(--dim);font-size:13px}
.selst button{border:1px solid var(--line2);border-radius:var(--r);padding:0 10px;min-height:24px;color:var(--dim)}
.selst button:hover{color:var(--text)}
.selst button.on{border-color:var(--amber);color:var(--amber)}
.gf{display:grid;gap:8px;margin-top:10px;border-top:1px dashed var(--line2);padding-top:10px;font-size:13.5px}
.gf label{display:grid;gap:2px;color:var(--dim)}
.gf .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--p);border:1px solid var(--line2);border-radius:var(--r);color:var(--text);font:inherit;padding:4px 8px;min-width:0;width:100%;min-height:28px}
textarea{resize:vertical;min-height:64px}

/* items */
.grp{margin:0 0 20px;--c:var(--dim)}
.grp.bug{--c:var(--red)} .grp.idea{--c:var(--cyan)} .grp.future_request{--c:var(--violet)}
.grp h4{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:15px;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grp h4 .gl{color:var(--c);font-size:13px;width:16px;text-align:center}
.grp h4 .cnt{font-family:var(--mono);font-size:13px;color:var(--dim);font-weight:400}
.grp h4 .hint{margin-left:auto;font-size:12.5px;color:var(--faint);font-weight:400}
.chk{list-style:none;margin:0;padding:0}
.chk li{border-radius:4px;border-left:2px solid transparent}
.chk li:hover{background:var(--p)}
.chk li.sel{background:var(--p);border-left-color:var(--amber)}
.chk details>summary{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;padding:4px 6px;align-items:start}
.chk .box{width:13px;height:13px;border:1.5px solid var(--line2);border-radius:3px;margin-top:5px}
.chk .planned .box{border-color:var(--c);background:var(--c);box-shadow:inset 0 0 0 2.5px var(--bg)}
.chk .ti{font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.chk details[open] .ti{-webkit-line-clamp:unset;display:block}
.chk .tag{font-size:12px;color:var(--c);white-space:nowrap;margin-top:2px}
.chk .det{margin:0 6px 8px 32px;font-size:13.5px;color:var(--dim);white-space:pre-wrap;overflow-wrap:anywhere}
.chk .det .mono{color:var(--faint);display:block;margin-top:4px;font-size:12px}
.chk .ia{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0;white-space:normal}
.grp .closed{font-size:13px;color:var(--faint);margin:4px 0 0 6px}
.grp .closed>summary{display:inline-block;min-height:24px}
.grp .closed .chk{margin-top:4px}
.grp .closed .chk .ti{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--line2)}

/* decisions and inbox */
.dec{list-style:none;padding:0;display:grid;gap:12px}
.dec li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:0 14px;font-size:14.5px}
.dec time{font-family:var(--mono);font-size:12.5px;color:var(--faint);padding-top:2px}
.dec .r{grid-column:2;color:var(--dim);font-size:13.5px}
.msgs{list-style:none;padding:0;display:grid;gap:6px}
.msgs li{font-size:14px;min-width:0;border-left:2px solid transparent;padding:2px 8px;border-radius:4px}
.msgs li.sel{background:var(--p);border-left-color:var(--amber)}
.msgs .h{font-size:12.5px;color:var(--faint)}
.msgs .h .kind{text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-right:6px}
.kind.task{color:var(--violet)} .kind.message{color:var(--cyan)} .kind.report{color:var(--amber)}
.msgs details>summary{display:block}
.msgs .ti{color:var(--dim);overflow-wrap:anywhere}
.msgs .unread .ti{color:var(--text);font-weight:600}
.msgs .body{font-size:13.5px;color:var(--dim);margin-top:6px;max-height:260px;padding:0 0 0 10px;border-top:0;border-left:2px solid var(--line)}
.empty{color:var(--faint);font-size:14px}
.cmd{margin-top:12px}
.frm{display:grid;gap:8px;margin-top:10px;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--p)}
.frm label{display:grid;gap:2px;color:var(--dim);font-size:13px}
.frm label em{color:var(--amber);font-style:normal}
.frm .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frm .btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ferr{color:var(--red);font-size:13px}

#toasts{position:fixed;right:16px;bottom:56px;display:grid;gap:8px;z-index:10;max-width:min(520px,calc(100vw - 32px))}
.toast{background:var(--p2);border:1px solid var(--line2);border-left:3px solid var(--amber);border-radius:var(--r);padding:8px 12px;display:flex;gap:12px;overflow-wrap:anywhere;font-size:14px}
.toast.err{border-left-color:var(--red)} .toast.err b{color:var(--red)}
.toast.ok b{color:var(--green)}
.toast button{margin-left:auto;color:var(--dim);min-width:24px;min-height:24px;text-align:center}
.keys{border-top:1px solid var(--line);background:var(--p);padding:8px 32px;color:var(--dim);display:flex;gap:6px 18px;font-size:13px;flex-wrap:wrap}
.keys button{min-height:24px}
.keys button:hover{color:var(--text)}
.keys kbd{font:12px var(--mono);color:var(--bg);background:var(--dim);border-radius:3px;padding:0 5px;margin-right:6px}

@media (max-width:1000px){
  .grid,.proj{grid-template-columns:minmax(0,1fr)}
  main{padding:20px 16px 40px} .top,.keys{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-view="overview">
<header class="top">
  <h1 class="brand">project-hub</h1>
  <nav class="nav" id="nav" aria-label="views"></nav>
  <span class="right"><span class="u" id="unread">0 unread</span><span class="st" id="sync"><b>●</b> <span>poll 5s · --:--:--</span></span></span>
</header>

<main>
<div class="view" id="overview">
  <p class="eyebrow" id="ov-eyebrow"></p>
  <p class="lead" id="ov-lead"></p>
  <div class="ovsub"><span id="ov-sub"></span><span class="flt" id="ov-filter"></span></div>
  <div class="projs" id="ov-body"></div>
  <p class="empty" id="ov-empty" hidden></p>
  <section class="res" aria-label="resources">
    <h2 class="eyebrow" id="rs-title"></h2>
    <ul id="rs-body"></ul>
    <p class="empty" id="rs-empty" hidden>No active resources.</p>
  </section>
</div>

<div class="view" id="project">
  <div class="ph-head" id="phead"></div>
  <div class="grid">
    <div class="wrap">
      <div class="brief" id="brief"></div>
      <section class="att" id="att" aria-label="waiting for you"></section>
      <section class="sec" aria-label="phases">
        <h3 class="eyebrow" id="ph-title"></h3>
        <div id="tl"></div>
      </section>
      <section class="sec" aria-label="decisions">
        <h3 class="eyebrow" id="dec-title"></h3>
        <div id="decs"></div>
      </section>
    </div>
    <div class="wrap">
      <section aria-label="items">
        <div class="sec-h"><h3 class="eyebrow" id="it-title"></h3><span class="chips" id="chips"></span></div>
        <form class="frm" id="f-item" hidden novalidate>
          <div class="row2">
            <label>type<select name="type"><option value="bug">bug</option><option value="idea">idea</option><option value="future_request">future_request</option></select></label>
            <label>title <em>(required)</em><input name="title" required maxlength="200"></label>
          </div>
          <label>details<textarea name="details"></textarea></label>
          <div class="btns"><button class="btn go" type="submit">Add item</button><button class="btn quiet" type="button" data-cancel>Cancel</button><span class="ferr" aria-live="polite"></span></div>
        </form>
        <div id="board"></div>
      </section>
      <section class="sec" aria-label="inbox">
        <h3 class="eyebrow" id="in-title"></h3>
        <div id="msgs"></div>
        <div class="cmd">
          <button class="btn" type="button" id="msg-open" aria-expanded="false">Post message (m)</button>
          <form class="frm" id="f-msg" hidden novalidate>
            <div class="row2">
              <label>to<select name="to"></select></label>
              <label>kind<select name="kind"><option value="message">message</option><option value="task">task</option><option value="report">report</option></select></label>
            </div>
            <label>title <em>(required)</em><input name="title" required maxlength="200"></label>
            <label>body <em>(required)</em><textarea name="body" required></textarea></label>
            <div class="btns"><button class="btn go" type="submit">Post message</button><button class="btn quiet" type="button" data-cancel>Cancel</button><span class="ferr" aria-live="polite"></span></div>
          </form>
        </div>
      </section>
    </div>
  </div>
</div>
</main>

<div id="toasts" aria-live="polite"></div>

<nav class="keys" aria-label="shortcuts">
  <button data-k="1" aria-label="overview"><kbd>1</kbd>overview</button>
  <button data-k="2" aria-label="project"><kbd>2</kbd>project</button>
  <button data-k="a" aria-label="add item"><kbd>a</kbd>add item</button>
  <button data-k="ArrowLeft" aria-label="move selected item left"><kbd>←</kbd>move left</button>
  <button data-k="ArrowRight" aria-label="move selected item right"><kbd>→</kbd>move right</button>
  <button data-k="m" aria-label="post message"><kbd>m</kbd>post message</button>
  <button data-k="r" aria-label="mark read"><kbd>r</kbd>mark read</button>
  <button data-k="d" aria-label="mark done"><kbd>d</kbd>mark done</button>
  <button data-k="x" aria-label="show discarded"><kbd>x</kbd>show discarded</button>
</nav>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const h = (tag, props, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k.startsWith("aria-") && typeof v === "boolean") e.setAttribute(k, String(v)); // aria-pressed="true"/"false", never an empty attribute
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  e.append(...kids.flat(Infinity).filter((x) => x != null && x !== false)); // strings become text nodes, never HTML
  return e;
};
const fill = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter((x) => x != null && x !== false));
const enc = encodeURIComponent;
const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));

const STATUSES = ["active", "paused", "parked", "done"];
const COLS = ["open", "planned", "done"];
const TYPES = [
  { t: "bug", glyph: "●", word: "Bugs", one: "bug", hint: "something broken", color: "red" },
  { t: "idea", glyph: "◆", word: "Ideas", one: "idea", hint: "worth trying", color: "cyan" },
  { t: "future_request", glyph: "▲", word: "Requests", one: "request", hint: "for later versions", color: "violet" },
];
const PHASE_ST = ["todo", "in_progress", "done"];
const GATE = { review: "Review", manual_test: "Manual test" };
const S = { projects: [], det: {}, pid: null, last: null, res: [], filter: "all", ovSel: 0, sel: null, tf: "all", disc: false, offline: false, key: "",
  exp: new Set(), gd: {}, cf: null, fk: null, focusNext: false, unread: 0 };

function ago(iso) {
  const m = (Date.now() - new Date(iso).getTime()) / 60000;
  if (!(m >= 1.5)) return "just now";
  if (m < 60) return Math.round(m) + " min ago";
  if (m < 1440) return Math.round(m / 60) + " h ago";
  return Math.round(m / 1440) + " d ago";
}

/* ---------- API + toasts ---------- */
function toast(text, kind) {
  const t = h("div", { class: "toast " + kind }, h("b", {}, kind === "err" ? "error" : "ok"), h("span", {}, text),
    h("button", { type: "button", "aria-label": "dismiss", onclick: () => t.remove() }, "×"));
  $("#toasts").append(t);
  setTimeout(() => t.remove(), kind === "err" ? 10000 : 3500);
}
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  let j = null;
  try { j = await r.json(); } catch (e) { /* non-JSON body */ }
  if (!r.ok) {
    let msg = j && j.error;
    if (!msg && j && Array.isArray(j.detail)) msg = j.detail.map((x) => (x.loc || []).slice(1).join(".") + ": " + x.msg).join("; ");
    throw new Error(msg || "The hub sent an unexpected response. Reload the page.");
  }
  return j;
}
// run a write, toast errors, refresh; returns true on success
async function act(fn, okText, errEl) {
  try {
    await fn();
    if (okText) toast(okText, "ok");
    await refresh(true);
    return true;
  } catch (e) {
    if (errEl) errEl.textContent = e.message;
    toast(e.message, "err");
    return false;
  }
}

/* ---------- data ---------- */
async function refresh(force) {
  try {
    const [list, unread, res] = await Promise.all([api("GET", "/api/projects"), api("GET", "/api/unread"), api("GET", "/api/resources")]);
    // the overview summarises every project, so every project's detail is fetched (local server, small files)
    const dets = await Promise.all(list.map((p) => api("GET", "/api/projects/" + enc(p.id)).catch((e) => { if (p.id === S.pid) throw e; return null; })));
    if (S.pid && !list.some((p) => p.id === S.pid)) await api("GET", "/api/projects/" + enc(S.pid)); // throws "unknown project", handled below
    S.unread = unread.count;
    S.offline = false;
    const det = Object.fromEntries(dets.filter(Boolean).map((d) => [d.id, d]));
    const key = JSON.stringify([list, det, res.map((r) => ({ ...r, seconds_left: left(r.seconds_left) }))]); // time left as shown, so it re-renders only when the text changes
    S.projects = list; S.det = det; S.res = res;
    syncBar();
    if (force || key !== S.key) { S.key = key; render(); }
  } catch (e) {
    if (S.pid && /^unknown /.test(e.message)) { toast(e.message, "err"); S.pid = null; S.last = null; location.hash = "#overview"; return; }
    S.offline = true;
    syncBar();
  }
}
function syncBar() {
  $("#sync").className = "st" + (S.offline ? " off" : "");
  $("#sync").lastChild.textContent = S.offline ? `Can't reach the hub at ${location.host}. Retrying every 5 s. ` : `${location.host} · poll 5s · ` + new Date().toTimeString().slice(0, 8);
  $("#unread").textContent = (S.unread || 0) + " unread";
}

/* ---------- the rules: current phase, waiting gates, unread reports ---------- */
const waitingGate = (ph) => (ph.gate === "manual_test" && ph.status !== "done") || (ph.gate === "review" && !ph.gate_approved);
function facts(d) {
  const phases = d.phases;
  let ci = phases.findIndex((x) => x.status === "in_progress");
  if (ci < 0) ci = phases.findIndex((x) => x.status === "todo");
  return {
    phases, ci, cur: ci >= 0 ? phases[ci] : null,
    done: phases.filter((x) => x.status === "done").length,
    gates: phases.map((x, i) => ({ ...x, n: i + 1 })).filter(waitingGate),
    reports: d.inbox.filter((m) => m.kind === "report" && m.status === "unread"),
  };
}
const isSel = (kind, id) => !!S.sel && S.sel.kind === kind && S.sel.id === id;
const urgency = (f) => f.gates.length + f.reports.length;

/* ---------- shared pieces ---------- */
function track(f) {
  return h("div", { class: "track", role: "img", "aria-label": `${f.done} of ${f.phases.length} phases done` },
    f.phases.map((x, i) => h("i", { class: x.status === "done" ? "d" : i === f.ci ? "c" : "" })));
}
function phaseSentence(f) {
  const total = f.phases.length;
  if (!total) return [h("b", {}, "No phases yet.")];
  if (!f.cur) return [h("b", {}, `All ${total} phases done.`)];
  return [h("b", {}, `Phase ${f.ci + 1} of ${total}: `), h("span", { class: "wrap" }, f.cur.name), `, ${f.cur.status === "in_progress" ? "in progress" : "not started yet"}.`];
}
function attentionSentence(f) {
  const parts = [];
  if (f.gates.length) parts.push(plural(f.gates.length, "gate") + (f.gates.length === 1 ? " is" : " are") + " waiting for you");
  if (f.reports.length) parts.push(plural(f.reports.length, "unread report"));
  return parts.length ? parts.join(", ") + "." : "Nothing is waiting for you.";
}
function gateTag(x) {
  if (!x.gate || x.gate === "none") return null;
  const ok = x.gate === "review" && x.gate_approved;
  return h("span", { class: "g " + (ok ? "ok" : x.gate) }, GATE[x.gate] + (ok ? " ✓ approved" : waitingGate(x) ? " · waiting for you" : ""));
}
function reportBody(m) {
  if (m.kind !== "report") return m.body;
  return m.body.split("\n").map((ln, i) => {
    const c = { "+": "ok", "-": "no", "→": "ar", ">": "ar" }[ln[0]];
    return [i ? "\n" : "", c ? h("span", { class: c }, ln[0]) : null, c ? ln.slice(1) : ln];
  });
}

/* inline confirmation: names the project and the phase; never window.confirm */
function ask(cf) { S.cf = cf; S.fk = "cfno"; render(); }
function cancelCf() { const fk = S.cf && S.cf.fk; S.cf = null; S.fk = fk; render(); }
function runCf() {
  const cf = S.cf; S.cf = null; S.fk = cf.fk;
  if (cf.act === "approve") act(() => api("POST", `/api/projects/${enc(cf.pid)}/phases/${cf.ph}/gate/approve`), "Gate approved");
  else if (cf.act === "done") act(() => api("POST", `/api/projects/${enc(cf.pid)}/phases/${cf.ph}`, { status: "done" }), "Phase marked done");
  else if (cf.act === "release") act(() => api("POST", "/api/resources/release", { resource: cf.resource }), "Resource released");
}
function cfBox(pid, ph, at) {
  const cf = S.cf;
  if (!cf || cf.pid !== pid || (cf.ph || null) !== (ph ? ph.id : null) || cf.at !== at) return null;
  const d = S.det[pid], name = d ? d.name : pid;
  const [text, yes] = cf.act === "approve" ? [`¿Aprobar el gate de «${ph.name}» en ${name}?`, "Sí, aprobar"]
    : cf.act === "done" ? [`¿Marcar «${ph.name}» como hecha en ${name}?`, "Sí, marcar como hecha"]
    : [`Force release ${cf.resource} held by ${name}?`, "Force release"];
  const no = cf.act === "release" ? "Cancel" : "Cancelar";
  return h("div", { class: "cf", role: "alertdialog", "aria-label": text },
    h("p", {}, text),
    h("div", { class: "btns" }, h("button", { type: "button", class: "btn go", "data-fk": "cfyes", onclick: runCf }, yes),
      h("button", { type: "button", class: "btn", "data-fk": "cfno", onclick: cancelCf }, no)));
}
// Aprobar / Marcar como hecha: always visible, no selection needed
function gateActs(d, ph, at) {
  const mk = (label, act, fk) => h("button", { type: "button", class: "btn go", "data-fk": fk, onclick: () => ask({ pid: d.id, ph: ph.id, act, at, fk }) }, label);
  return [ph.gate === "review" && !ph.gate_approved ? mk("Aprobar", "approve", `gap${at}${ph.id}`) : null,
    ph.gate === "manual_test" && ph.status !== "done" ? mk("Marcar como hecha", "done", `gdn${at}${ph.id}`) : null];
}
function gateCall(d, g, at) {
  return h("div", { class: "call gate-" + g.gate },
    h("div", { class: "crow" },
      h("div", { class: "ctext" },
        h("div", {}, h("span", { class: "k" }, GATE[g.gate] + " gate"), h("span", { class: "t wrap" }, h("span", { class: "n" }, String(g.n).padStart(2, "0") + " "), g.name)),
        h("div", { class: "why wrap" }, g.gate_reason || (g.gate === "manual_test" ? "Needs a test by you before it can close." : "Needs your approval before it starts."),
          g.gate_set_by ? h("span", { class: "faint" }, " · set by " + g.gate_set_by) : null)),
      h("div", { class: "cacts" }, gateActs(d, g, at))),
    cfBox(d.id, g, at));
}
function tog(k, extra) {
  return (e) => { e.preventDefault(); S.exp.has(k) ? S.exp.delete(k) : S.exp.add(k); if (extra) extra(); render(); };
}
const selMsg = (m) => () => { S.sel = { kind: "msg", id: m.id }; };
const markBtns = (m) => h("div", { class: "mk" },
  m.status === "unread" ? h("button", { type: "button", class: "btn sm", "aria-label": "Mark read", onclick: () => setMsg(m.id, "read") }, "Mark read (r)") : null,
  m.status !== "done" ? h("button", { type: "button", class: "btn sm", "aria-label": "Mark done", onclick: () => setMsg(m.id, "done") }, "Mark done (d)") : null);

/* ---------- render ---------- */
function render() {
  const a = document.activeElement, fk = a && a.dataset && a.dataset.fk;
  S.caret = a && a.tagName === "INPUT" ? a.selectionStart : null;
  document.body.dataset.view = S.pid ? "project" : "overview";
  renderNav();
  S.pid ? renderProject() : renderOverview();
  const want = S.fk || fk; S.fk = null;
  if (S.focusNext) {
    const t = S.pid ? (S.det[S.pid] && $("#phead h2")) : document.querySelector(".proj.sel h2 a");
    if (t) { t.focus(); S.focusNext = false; }
  } else if (want) { const n = document.querySelector(`[data-fk="${CSS.escape(want)}"]`); if (n) { n.focus(); if (n.tagName === "INPUT" && S.caret != null && want === fk) try { n.setSelectionRange(S.caret, S.caret); } catch (e) { /* ignore */ } } }
}
function renderNav() {
  fill($("#nav"), h("a", { id: "tab-ov", class: "tab", href: "#overview", "aria-current": S.pid ? null : "page", "data-fk": "nav-ov" }, "Overview"),
    S.projects.map((p) => { const d = S.det[p.id]; const hot = d && urgency(facts(d));
      return h("a", { class: "tab", href: "#p/" + enc(p.id), "aria-current": S.pid === p.id ? "page" : null, "data-fk": "nav" + p.id },
        p.name, hot ? h("span", { class: "dot", role: "img", "aria-label": "needs attention" }) : null); }));
}

const ovRows = () => S.projects.filter((p) => S.det[p.id]).map((p) => ({ p, d: S.det[p.id], f: facts(S.det[p.id]) }))
  .filter((r) => S.filter === "all" || r.p.status === S.filter)
  .sort((a, b) => urgency(b.f) - urgency(a.f) || STATUSES.indexOf(a.p.status) - STATUSES.indexOf(b.p.status) || b.p.updated_at.localeCompare(a.p.updated_at)); // stable: urgent first, then status, then newest
const visibleProjects = () => ovRows().map((r) => r.p);

function renderOverview() {
  const all = S.projects.filter((p) => S.det[p.id]).map((p) => ({ p, f: facts(S.det[p.id]) }));
  const tg = all.reduce((s, r) => s + r.f.gates.length, 0), tr = all.reduce((s, r) => s + r.f.reports.length, 0);
  const hot = all.filter((r) => urgency(r.f)).map((r) => r.p.name);
  $("#ov-eyebrow").textContent = "Briefing · " + new Date().toLocaleString("en-GB", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  fill($("#ov-lead"), tg + tr
    ? [h("b", {}, [tg ? plural(tg, "gate") : null, tr ? plural(tr, "unread report") : null].filter(Boolean).join(" and ")), ` ${tg + tr === 1 ? "is" : "are"} waiting for you, in ${hot.join(" and ")}.`]
    : [h("b", {}, "Nothing is waiting for you.")]);
  $("#ov-sub").textContent = `${plural(all.length, "project")}, ${all.filter((r) => r.p.status === "active").length} active. Most urgent first.`;
  fill($("#ov-filter"), ["all", ...STATUSES].map((f) => h("button", { type: "button", class: S.filter === f ? "on" : "", "aria-pressed": S.filter === f, onclick: () => { S.filter = f; S.ovSel = 0; render(); } }, f)));
  const rows = ovRows();
  S.ovSel = Math.min(S.ovSel, Math.max(0, rows.length - 1));
  $("#ov-empty").hidden = rows.length > 0;
  $("#ov-empty").textContent = S.projects.length ? "No projects with this status." : "No projects yet. Create one from Claude with create_project.";
  fill($("#ov-body"), rows.map(({ p, d, f }, i) => {
    const side = [...f.gates.map((g) => gateCall(d, g, "ov")), ...f.reports.map((m) =>
      h("div", { class: "call" }, h("div", {}, h("span", { class: "k" }, "Unread report"), h("span", { class: "faint" }, ago(m.created_at))), h("div", { class: "t wrap" }, m.title)))];
    const open = d.items.filter((x) => x.status === "open" || x.status === "planned");
    const chips = TYPES.map((T) => [T, open.filter((x) => x.type === T.t).length]).filter(([, n]) => n)
      .map(([T, n]) => h("span", { class: "chip" }, h("span", { style: `color:var(--${T.color})`, "aria-hidden": "true" }, T.glyph), ` ${n} ${n === 1 ? T.one : T.word.toLowerCase()}`));
    return h("article", { class: "proj" + (side.length ? " hot" : "") + (i === S.ovSel ? " sel" : ""), onclick: (e) => { S.ovSel = i; if (!e.target.closest("a,button,details,summary")) open_(p.id); } },
      h("div", { class: "wrap" },
        h("h2", {}, h("a", { href: "#p/" + enc(p.id), "data-fk": "r" + p.id }, p.name), h("span", { class: "status s-" + p.status }, p.status)),
        h("p", { class: "sum" }, phaseSentence(f)),
        h("p", { class: "nxt" }, "Next step: ", h("span", { class: "wrap" }, p.next_step || "not set")),
        h("div", { class: "meta" }, track(f), h("span", { class: "mono" }, `${f.done}/${f.phases.length}`), h("span", {}, "updated ", ago(p.updated_at))),
        chips.length ? h("div", { class: "chips", "aria-label": "open items" }, chips) : null),
      h("div", { class: "side" }, side.length ? side : h("p", { class: "calm" }, "✓ Nothing waiting for you")));
  }));
  renderResources();
}
function left(sec) {
  const m = Math.floor(sec / 60);
  return m < 1 ? "<1m" : m < 60 ? m + "m" : Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m";
}
function renderResources() {
  const name = (id) => (S.projects.find((p) => p.id === id) || { name: id }).name;
  $("#rs-title").textContent = "Resources in use · " + S.res.length;
  $("#rs-empty").hidden = S.res.length > 0;
  fill($("#rs-body"), S.res.map((r) => h("li", {},
    h("span", { class: "tx" }, h("span", { class: "mono" }, r.resource), " held by ", h("a", { href: "#p/" + enc(r.project_id) }, name(r.project_id)), r.purpose ? ` for “${r.purpose}”` : "", ", ", h("span", { class: "mono" }, left(r.seconds_left)), " left"),
    h("button", { type: "button", class: "btn sm quiet", "data-fk": "rl" + r.resource, "aria-label": `Force release ${r.resource} held by ${name(r.project_id)}`,
      onclick: () => ask({ pid: r.project_id, act: "release", resource: r.resource, at: "res", fk: "rl" + r.resource }) }, "force release"),
    S.cf && S.cf.act === "release" && S.cf.resource === r.resource ? cfBox(r.project_id, null, "res") : null)));
}

/* ---------- project ---------- */
function renderProject() {
  const d = S.det[S.pid];
  if (!d || d.id !== S.pid) return;
  const f = facts(d);
  fill($("#phead"), h("h2", { tabindex: "-1" }, d.name), h("span", { class: "status s-" + d.status }, d.status),
    d.repo_path ? h("span", { class: "repo" }, "repo ", h("span", { class: "mono" }, d.repo_path)) : null,
    h("span", { class: "dim", style: "font-size:13px" }, "updated ", ago(d.updated_at)),
    h("a", { class: "back", href: "#overview" }, "← All projects"),
    d.autonomy ? h("p", { class: "aut" }, d.autonomy) : null,
    d.description ? h("p", { class: "desc" }, d.description) : null);

  const n = f.gates.length + f.reports.length;
  fill($("#brief"), h("p", {}, phaseSentence(f)), h("p", { class: "wrap" }, h("span", { class: "k" }, "Next step: "), d.next_step || "not set."),
    h("p", { class: "att-line", style: `color:var(--${n ? "amber" : "green"})` }, n ? "" : "✓ ", attentionSentence(f)),
    h("div", { style: "display:flex;align-items:center;gap:12px;margin:12px 0 0" }, track(f), h("span", { class: "mono dim", style: "font-size:13px" }, `${f.done}/${f.phases.length} done`)));
  fill($("#att"), f.gates.map((g) => gateCall(d, g, "al")), f.reports.map((m) => {
    const k = "r" + m.id;
    return h("div", { class: "call" + (isSel("msg", m.id) ? " sel" : "") },
      h("details", { open: S.exp.has(k) },
        h("summary", { "data-fk": "ra" + m.id, onclick: tog(k, selMsg(m)) }, h("span", { class: "k" }, "Unread report"), h("span", { class: "t wrap" }, m.title),
          h("span", { class: "more" }, ago(m.created_at), " · ", S.exp.has(k) ? "hide" : "show")),
        h("div", { class: "body" }, reportBody(m), markBtns(m))));
  }));
  $("#att").hidden = !n;
  renderTimeline(d, f);
  renderItems(d);

  $("#dec-title").textContent = "Decisions · " + d.decisions.length;
  fill($("#decs"), d.decisions.length ? h("ol", { class: "dec" }, [...d.decisions].reverse().map((x) => h("li", {}, h("time", { datetime: x.date }, x.date.slice(0, 10)),
    h("span", { class: "wrap" }, x.decision), x.reason ? h("span", { class: "r wrap" }, "because " + x.reason) : null))) : h("p", { class: "empty" }, "No decisions logged yet."));

  const rest = d.inbox.filter((m) => !f.reports.includes(m)); // unread reports are alerts above; already newest first
  const unread = d.inbox.filter((m) => m.status === "unread").length;
  $("#in-title").textContent = `Inbox · ${unread} unread of ${d.inbox.length}`;
  fill($("#msgs"), rest.length ? h("ul", { class: "msgs" }, rest.map((m) => {
    const k = "m" + m.id;
    return h("li", { class: m.status + (isSel("msg", m.id) ? " sel" : ""), "data-id": m.id },
      h("details", { open: S.exp.has(k) },
        h("summary", { "data-fk": "m" + m.id, "aria-label": `${m.kind}: ${m.title}`, onclick: tog(k, selMsg(m)) },
          h("div", { class: "h" }, h("span", { class: "kind " + m.kind }, m.kind), `${m.from_project} → ${m.to_project} · ${ago(m.created_at)} · ${m.status}`),
          h("div", { class: "ti" }, m.title)),
        h("div", { class: "body" }, reportBody(m), markBtns(m))));
  })) : h("p", { class: "empty" }, f.reports.length ? "Nothing else in the inbox." : "Inbox is empty."));

  const to = $("#f-msg [name=to]"), cur = to.value;
  fill(to, h("option", { value: d.id }, "this project (" + d.id + ")"), h("option", { value: "all" }, "all"));
  to.value = cur === "all" ? "all" : d.id;
}

function renderTimeline(d, f) {
  const ph = f.phases;
  $("#ph-title").textContent = `Phases · ${f.done} of ${ph.length} done`;
  if (!ph.length) return fill($("#tl"), h("p", { class: "empty" }, "No phases yet. Add them from Claude with add_phase."));
  const doneIdx = ph.map((x, i) => i).filter((i) => ph[i].status === "done" && (f.ci < 0 || i < f.ci));
  const li = [];
  if (doneIdx.length) li.push(h("li", { class: "done" }, h("details", { class: "donesum", open: S.exp.has("dn") },
    h("summary", { "data-fk": "dnsum", onclick: tog("dn") }, `✓ ${plural(doneIdx.length, "phase")} done`, h("span", { class: "ar", "aria-hidden": "true" }, "▸")),
    h("ol", { class: "donelist" }, doneIdx.map((i) => h("li", {}, phaseEntry(d, f, i, "dn")))))));
  ph.forEach((x, i) => { if (!doneIdx.includes(i)) li.push(h("li", { class: (i === f.ci ? "cur" : x.status === "done" ? "done" : "up") + (isSel("phase", x.id) ? " sel" : "") }, phaseEntry(d, f, i, i === f.ci ? "cur" : "up"))); });
  fill($("#tl"), h("ol", { class: "tl" }, li));
}
function phaseEntry(d, f, i, kind) {
  const x = f.phases[i], sel = isSel("phase", x.id), num = String(i + 1).padStart(2, "0");
  const toggleSel = () => { S.sel = sel ? null : { kind: "phase", id: x.id }; render(); };
  const gr = x.gate && x.gate !== "none" && x.gate_reason && (waitingGate(x) || kind === "cur") ? h("span", { class: "gr" }, x.gate_reason) : null;
  const head = kind === "cur"
    ? [h("span", { class: "lbl" }, x.status === "in_progress" ? "Now · in progress" : "Now · next to start", h("span", { class: "n" }, `${i + 1}/${f.phases.length}`), sel ? h("span", { class: "selb" }, "Selected") : null),
      h("span", { class: "cn" }, x.name, gateTag(x))]
    : [h("span", { class: "nm" }, h("span", { class: "n" }, num), x.name, gateTag(x), sel ? h("span", { class: "selb" }, "Selected") : null)];
  const acts = gateActs(d, x, "tl").filter(Boolean);
  return h("div", { class: `pe ${kind}` + (sel ? " sel" : "") + (x.gate && x.gate !== "none" ? " g-" + x.gate : "") + " st-" + x.status, "data-id": x.id },
    h("button", { type: "button", class: "pmain", "data-fk": "ph" + x.id, "aria-pressed": sel, onclick: toggleSel },
      head, gr, kind === "cur" && !x.notes ? h("span", { class: "nt", style: "color:var(--dim)" }, "No notes for this phase.") : x.notes ? h("span", { class: "nt", title: x.notes }, x.notes) : null),
    acts.length ? h("div", { class: "pacts" }, acts) : null,
    cfBox(d.id, x, "tl"),
    sel ? h("div", { class: "selst" }, "status:", PHASE_ST.map((s) => h("button", { type: "button", "data-fk": `ps${s}${x.id}`, class: x.status === s ? "on" : "", "aria-pressed": x.status === s, onclick: () => setPhase(d.id, x.id, s, `ps${s}${x.id}`) }, s.replace("_", " ")))) : null,
    sel ? gateForm(d, x) : null);
}
function gateForm(d, p) {
  const k = d.id + "/" + p.id, base = { gate: p.gate || "none", reason: p.gate_reason || "" };
  const dr = S.gd[k] || base, edit = (f, v) => { S.gd[k] = { ...dr, [f]: v }; Object.assign(dr, S.gd[k]); }; // draft exists only once the user typed, so polling never overwrites it and untouched forms follow the server
  const err = h("span", { class: "ferr", role: "alert" });
  const sel = h("select", { "data-fk": "gs" + p.id, id: "gs" + p.id, onchange: (e) => { edit("gate", e.target.value); } },
    [["none", "none"], ["review", "review"], ["manual_test", "manual test"]].map(([v, l]) => h("option", { value: v, selected: dr.gate === v }, l)));
  const inp = h("input", { "data-fk": "gr" + p.id, id: "gr" + p.id, maxlength: "160", value: dr.reason, oninput: (e) => { edit("reason", e.target.value); } });
  const set = async () => {
    err.textContent = "";
    if (dr.gate !== "none" && !dr.reason.trim()) { err.textContent = "Reason is required."; inp.focus(); return; }
    const ok = await act(() => api("POST", `/api/projects/${enc(d.id)}/phases/${p.id}/gate`, { gate: dr.gate, reason: dr.gate === "none" ? "" : dr.reason }), dr.gate === "none" ? "Gate removed" : "Gate set", err);
    if (ok) delete S.gd[k]; // saved; show server values again
  };
  return h("div", { class: "gf" }, h("label", {}, "gate", sel), h("label", {}, "reason (max 160)", inp), err,
    h("div", { class: "btns" }, h("button", { type: "button", class: "btn", "data-fk": "gset" + p.id, onclick: set }, "Set gate")));
}

function renderItems(d) {
  const live = d.items.filter((i) => i.status !== "discarded"), disc = d.items.filter((i) => i.status === "discarded");
  const isOpen = (i) => i.status === "open" || i.status === "planned";
  $("#it-title").textContent = `Items · ${d.items.filter(isOpen).length} open`;
  fill($("#chips"), [["all", "all"], ...TYPES.map((T) => [T.t, T.word])].map(([f, l]) =>
    h("button", { type: "button", class: "chip-b" + (S.tf === f ? " on" : ""), "aria-pressed": S.tf === f, onclick: () => { S.tf = f; render(); } }, l)),
    h("button", { type: "button", class: "chip-b", "aria-pressed": S.disc, onclick: toggleDisc }, `${S.disc ? "-" : "+"}discarded (${disc.length})`),
    h("button", { type: "button", class: "btn sm go", "aria-label": "add item", "data-fk": "additem", onclick: () => openForm("item") }, "Add item (a)"));
  const groups = TYPES.filter((T) => S.tf === "all" || S.tf === T.t).map((T) => {
    const its = d.items.filter((i) => i.type === T.t && (S.disc || i.status !== "discarded")).sort((a, b) => b.created_at.localeCompare(a.created_at));
    if (!its.length && S.tf === "all") return null;
    const open = its.filter(isOpen).sort((a, b) => (b.status === "planned") - (a.status === "planned"));
    const closed = its.filter((i) => !isOpen(i)), ck = "cl" + T.t;
    return h("section", { class: "grp " + T.t, "aria-label": T.word },
      h("h4", {}, h("span", { class: "gl", "aria-hidden": "true" }, T.glyph), T.word, h("span", { class: "cnt" }, "· " + open.length), h("span", { class: "hint" }, T.hint)),
      open.length ? h("ul", { class: "chk" }, open.map((i) => itemRow(i))) : h("p", { class: "empty", style: "margin:4px 6px" }, `No open ${T.word.toLowerCase()}.`),
      closed.length ? h("details", { class: "closed", open: S.exp.has(ck) }, h("summary", { "data-fk": ck, onclick: tog(ck) }, `${closed.length} closed ${S.exp.has(ck) ? "▾" : "▸"}`), h("ul", { class: "chk" }, closed.map((i) => itemRow(i)))) : null);
  }).filter(Boolean);
  fill($("#board"), groups.length ? groups : h("p", { class: "empty" }, live.length || disc.length ? "No items of this type." : "No items yet. Press a to add one."));
}
function itemRow(i) {
  const T = TYPES.find((x) => x.t === i.type), sel = isSel("item", i.id), k = "i" + i.id;
  const mv = (st, lab, txt) => h("button", { type: "button", class: "btn sm quiet", "aria-label": `${lab}: ${i.title}`, onclick: () => setItem(i.id, st) }, txt);
  const idx = COLS.indexOf(i.status);
  return h("li", { class: i.status + (sel ? " sel" : ""), "data-id": i.id },
    h("details", { open: S.exp.has(k) },
      h("summary", { "data-fk": k, "aria-label": `${T.one}: ${i.title}`, onclick: tog(k, () => { S.sel = { kind: "item", id: i.id }; }) },
        h("span", { class: "box", "aria-hidden": "true" }), h("span", { class: "ti" }, i.title),
        i.status === "planned" ? h("span", { class: "tag" }, "planned") : i.status === "open" ? h("span", { class: "sr" }, "open") : h("span", { class: "tag", style: "color:var(--faint)" }, i.status)),
      h("div", { class: "det" }, i.details || "No details.", h("span", { class: "mono" }, `${T.one} · #${i.id.slice(0, 8)} · ${i.status} · added ${(i.created_at || "").slice(0, 10)}`),
        h("div", { class: "ia" }, i.status === "discarded" ? mv("open", "Restore to open", "↺ restore") : [idx > 0 ? mv(COLS[idx - 1], "Move to " + COLS[idx - 1], "← " + COLS[idx - 1]) : null,
          idx < 2 ? mv(COLS[idx + 1], "Move to " + COLS[idx + 1], COLS[idx + 1] + " →") : null, mv("discarded", "Discard item", "✕ discard")]))));
}

/* ---------- actions ---------- */
const open_ = (id) => { location.hash = "#p/" + enc(id); };
function setPhase(pid, id, status, fk) {
  const ph = S.det[pid].phases.find((x) => x.id === id);
  if (status === "done" && ph.status !== "done" && ph.gate && ph.gate !== "none") return ask({ pid, ph: id, act: "done", at: "tl", fk }); // gated phase: confirm first
  return act(() => api("POST", `/api/projects/${enc(pid)}/phases/${id}`, { status }), "Phase set to " + status);
}
const setItem = (id, status) => act(() => api("PATCH", `/api/projects/${enc(S.pid)}/items/${id}`, { status }), "Item moved to " + status);
const setMsg = (id, status) => act(() => api("PATCH", `/api/messages/${id}`, { status }), "Message marked " + status);
function toggleDisc() { S.disc = !S.disc; render(); }
function syncExp() { $("#msg-open").setAttribute("aria-expanded", String(!$("#f-msg").hidden)); }
function openForm(which) {
  const f = $(which === "item" ? "#f-item" : "#f-msg");
  f.hidden = false; syncExp();
  f.querySelector("[name=title]").focus();
  f.scrollIntoView({ block: "nearest" });
}
function closeForm(f) { f.hidden = true; syncExp(); }
function bindForm(f, send, okText) {
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = f.querySelector("[type=submit]"), err = f.querySelector(".ferr"), v = Object.fromEntries(new FormData(f));
    err.textContent = "";
    const empty = [...f.querySelectorAll("[required]")].find((x) => !x.value.trim());
    if (empty) { err.textContent = `${empty.name[0].toUpperCase() + empty.name.slice(1)} is required.`; empty.focus(); return; }
    btn.disabled = true;
    const ok = await act(() => send(v), okText, err);
    btn.disabled = false;
    if (!ok) { const w = (err.textContent.match(/\b(title|body|details|type|kind)\b/) || [])[1]; (f.querySelector(`[name=${w}]`) || f.querySelector("[name=title]")).focus(); }
    if (ok) { f.querySelectorAll("[name=title],[name=details],[name=body]").forEach((x) => (x.value = "")); closeForm(f); }
  });
  f.querySelector("[data-cancel]").addEventListener("click", () => closeForm(f));
  f.addEventListener("keydown", (e) => { if (e.key === "Escape") closeForm(f); });
}
bindForm($("#f-item"), (v) => api("POST", `/api/projects/${enc(S.pid)}/items`, { type: v.type, title: v.title, details: v.details }), "Item added");
bindForm($("#f-msg"), (v) => api("POST", "/api/messages", { to_project: v.to, kind: v.kind, title: v.title, body: v.body }), "Message posted");
$("#msg-open").addEventListener("click", () => ($("#f-msg").hidden ? openForm("msg") : closeForm($("#f-msg"))));

/* ---------- keyboard ---------- */
function step(dir) {
  if (!S.pid) {
    const n = visibleProjects().length;
    if (n) { S.ovSel = Math.max(0, Math.min(n - 1, S.ovSel + dir)); render(); const r = document.querySelector(".proj.sel"); if (r) r.scrollIntoView({ block: "nearest" }); }
    return;
  }
  const fl = [...document.querySelectorAll("#board li[data-id]")].filter((e) => e.offsetParent).map((e) => e.dataset.id); // what is on screen, in order
  if (!fl.length) return;
  const i = S.sel && S.sel.kind === "item" ? fl.indexOf(S.sel.id) : -1;
  S.sel = { kind: "item", id: fl[Math.max(0, Math.min(fl.length - 1, i + dir))] };
  render();
  const n = document.querySelector("#board li.sel"); if (n) n.scrollIntoView({ block: "nearest" });
}
function key(k, target) {
  const inBtn = target && target.closest && target.closest("button,a,summary");
  if (k === "Escape") { if (S.cf) cancelCf(); return; }
  if (k === "1") { location.hash = "#overview"; return; }
  if (k === "2") { const p = S.pid || S.last || (visibleProjects()[S.ovSel] || {}).id; if (p) open_(p); return; }
  if (k === "ArrowUp") return step(-1);
  if (k === "ArrowDown") return step(1);
  if (k === "Enter") { if (!S.pid && !inBtn) { const p = visibleProjects()[S.ovSel]; if (p) open_(p.id); } return; }
  const d = S.det[S.pid];
  if (!S.pid || !d) return;
  const sel = S.sel;
  if (k === "a") return openForm("item");
  if (k === "m") return openForm("msg");
  if (k === "x") return toggleDisc();
  if (k === " ") { if (sel && sel.kind === "phase" && !inBtn) { const p = d.phases.find((x) => x.id === sel.id); if (p) setPhase(d.id, p.id, PHASE_ST[(PHASE_ST.indexOf(p.status) + 1) % 3]); } return; }
  if (k === "ArrowLeft" || k === "ArrowRight") {
    const it = sel && sel.kind === "item" && d.items.find((x) => x.id === sel.id);
    if (!it) { toast("Select an item first: use ↑↓ or click one.", "err"); return; }
    if (it.status === "discarded") return k === "ArrowLeft" ? setItem(it.id, "open") : undefined;
    const to = COLS[COLS.indexOf(it.status) + (k === "ArrowRight" ? 1 : -1)];
    return to ? setItem(it.id, to) : undefined;
  }
  if (k === "r" || k === "d") {
    let m = sel && sel.kind === "msg" && d.inbox.find((x) => x.id === sel.id);
    if (!m) m = d.inbox.find((x) => x.status === "unread");
    if (!m) { toast("No unread message to mark.", "err"); return; }
    return setMsg(m.id, k === "r" ? "read" : "done");
  }
}
addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (!["1", "2", "a", "m", "r", "d", "x", " ", "Enter", "Escape", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) return;
  if (e.key === "a" || e.key === "m" || e.key.startsWith("Arrow") || (e.key === " " && !e.target.closest("button,a,summary"))) e.preventDefault();
  key(e.key, e.target);
});
document.querySelectorAll(".keys [data-k]").forEach((b) => b.addEventListener("click", () => key(b.dataset.k)));

/* ---------- routing ---------- */
function route() {
  const m = location.hash.match(/^#p\/(.+)$/);
  const pid = m ? decodeURIComponent(m[1]) : null;
  if (pid !== S.pid) {
    S.pid = pid; S.sel = null; S.gd = {}; S.exp.clear(); S.cf = null; S.key = "";
    if (pid) S.last = pid;
    else { const i = visibleProjects().findIndex((x) => x.id === S.last); if (i >= 0) S.ovSel = i; }
    S.focusNext = true;
    for (const f of [$("#f-item"), $("#f-msg")]) { f.hidden = true; f.reset(); f.querySelector(".ferr").textContent = ""; }
    syncExp();
    window.scrollTo(0, 0);
  }
  refresh(true);
}
addEventListener("hashchange", route);
route();
setInterval(() => refresh(false), 5000);
</script>
</body>
