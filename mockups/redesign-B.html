<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>project-hub · proposal B · split ledger</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0E1013; --p:#13161B; --p2:#1A1E25; --line:#2A2F38; --line2:#3A404B;
  --text:#D7DBE2; --dim:#A0A8B5; --faint:#7A8190;
  --amber:#FFB547; --cyan:#6CD3E8; --green:#8BD47C; --red:#FF7A7A; --violet:#C29BFF; --blue:#7AB6FF;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,ui-monospace,monospace;
  --bar:34px; --foot:30px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.55 var(--mono);min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
ul{list-style:none}
:focus-visible{outline:1px solid var(--amber);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top tab bar + bottom shortcut bar */
.bar{position:sticky;top:0;z-index:5;display:flex;height:var(--bar);background:var(--p);border-bottom:1px solid var(--line)}
.bar>*{display:flex;align-items:center;padding:0 14px;border-right:1px solid var(--line);white-space:nowrap}
.bar .logo{background:var(--amber);color:var(--bg);font-weight:700;border:0}
.bar .tab{color:var(--dim)} .bar .tab kbd{color:var(--faint);background:none;padding:0;margin-right:6px;font:inherit}
.bar .tab.on{color:var(--text);background:var(--bg);box-shadow:inset 0 -2px 0 var(--amber)}
.bar .sp{flex:1;border:0}
.bar .st{color:var(--dim);gap:8px;border:0;border-left:1px solid var(--line)}
.bar .st b{color:var(--amber);font-weight:400}
.foot{position:fixed;left:0;right:0;bottom:0;height:var(--foot);display:flex;gap:22px;align-items:center;padding:0 24px;background:var(--p);border-top:1px solid var(--line);color:var(--dim);font-size:12px;z-index:5}
.foot button{color:var(--dim)} .foot button[hidden]{display:none} .foot button:hover{color:var(--text)}
kbd{font:inherit;background:var(--dim);color:var(--bg);padding:0 5px;margin-right:6px}

main{padding:18px 24px calc(var(--foot) + 22px);min-width:0}
.view[hidden]{display:none}

/* pane: title on the top border */
.pane{border:1px solid var(--line);position:relative;padding:16px 16px 12px;margin-bottom:22px;min-width:0}
.pane>.lbl{position:absolute;top:-10px;left:12px;background:var(--bg);padding:0 8px;color:var(--amber);display:flex;gap:10px;line-height:20px}
.pane>.lbl span{color:var(--dim)}
.pane>.rt{position:absolute;top:-10px;right:12px;background:var(--bg);padding:0 8px;color:var(--dim);display:flex;gap:12px;line-height:20px}
.tg{color:var(--dim)} .tg:hover{color:var(--text)} .tg small{color:var(--faint);font-size:inherit;margin-left:4px}
.tg[aria-pressed=true]{color:var(--text)}
.tg[aria-pressed=true]::before{content:"[";color:var(--amber)} .tg[aria-pressed=true]::after{content:"]";color:var(--amber)}
.empty{color:var(--faint)} .empty::before{content:"# ";color:var(--line2)}
.ok{color:var(--green)}
.meta{color:var(--faint);font-size:12px}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrap{overflow-wrap:anywhere}

.prompt{color:var(--dim);margin-bottom:18px}
.prompt b{color:var(--green);font-weight:400} .prompt i{font-style:normal;color:var(--text)}
.caret{display:inline-block;width:8px;height:15px;background:var(--amber);vertical-align:-3px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

/* status, type, gate tags: colour + word, always */
.tag{color:var(--c);white-space:nowrap} .tag::before{content:"● "}
.s-active{--c:var(--green)} .s-paused{--c:var(--amber)} .s-parked{--c:var(--violet)} .s-done{--c:var(--blue)}
.ty{display:inline-block;width:76px;text-align:center;border:1px solid var(--c);color:var(--c);font-size:11.5px;line-height:18px}
.ty-bug{--c:var(--red)} .ty-idea{--c:var(--cyan)} .ty-future_request{--c:var(--violet)}
.gb{color:var(--c);font-size:11.5px;white-space:nowrap;font-weight:700}
.gb::before{content:"◆ "}
.g-manual_test{--c:var(--amber)} .g-review{--c:var(--violet)} .g-ok{--c:var(--green)} .g-ok{font-weight:400}
.kind{display:inline-block;width:64px;text-align:center;font-size:11.5px;line-height:18px;font-weight:700}
.k-gate{color:var(--bg);background:var(--amber)} .k-review{color:var(--bg);background:var(--violet)}
.k-msg{color:var(--cyan);border:1px solid var(--cyan);line-height:16px} .k-report{color:var(--amber);border:1px solid var(--amber);line-height:16px} .k-task{color:var(--violet);border:1px solid var(--violet);line-height:16px}
.badge{color:var(--bg);background:var(--amber);padding:0 6px;font-weight:700}
.zero{color:var(--faint)}

/* phase strip: one cell per phase */
.strip{display:inline-flex;gap:2px;vertical-align:-1px}
.strip i{width:8px;height:12px;background:#262B33}
.strip i.d{background:var(--green)} .strip i.c{background:var(--amber)} .strip i.w{box-shadow:inset 0 -3px var(--violet)}
.frac{color:var(--dim);margin-left:8px}

table{width:100%;border-collapse:collapse;table-layout:fixed}
th{text-align:left;font-weight:400;color:var(--faint);padding:0 12px 6px 0;border-bottom:1px solid var(--line);text-transform:uppercase;font-size:11.5px;letter-spacing:.06em;white-space:nowrap}
td{padding:7px 12px 7px 0;border-bottom:1px solid #1C2027;vertical-align:top;min-width:0}
tr:hover td{background:var(--p)}
td a:hover,.lnk:hover{color:var(--amber)}

/* ---------- overview ---------- */
#wt col.c1{width:84px} #wt col.c2{width:150px} #wt col.c4{width:170px} #wt col.c5{width:70px}
#wt .what{color:var(--text);font-weight:700}
#wt .why{color:var(--dim)}
#pt col.c1{width:92px} #pt col.c2{width:22%} #pt col.c3{width:230px} #pt col.c4{width:24%} #pt col.c6{width:84px} #pt col.c7{width:70px}
#pt .nm{font-weight:700} #pt .nm a{display:block}
#pt .desc{color:var(--faint);font-size:12px}
#pt .ph b{color:var(--faint);font-weight:400;margin-right:6px}
#pt .nx{color:var(--text)}
#rt col.c1{width:24%} #rt col.c2{width:18%} #rt col.c4{width:100px}

/* ---------- project ---------- */
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;margin-bottom:18px}
.phead h2{font-size:22px;line-height:1.2}
.phead .repo{color:var(--faint);min-width:0;flex:1 1 200px} .phead .repo span{color:var(--dim)}
.phead .desc{flex-basis:100%;color:var(--dim)}
.back{color:var(--dim)} .back:hover{color:var(--amber)}

.split{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px;align-items:start}
.ledger{position:sticky;top:calc(var(--bar) + 16px);max-height:calc(100vh - var(--bar) - var(--foot) - 34px);display:flex;flex-direction:column;padding:14px 0 0}
.ledger ul{overflow-y:auto;padding:0 0 6px;min-height:0}
.ledger li{border-left:2px solid transparent}
.pl{display:grid;grid-template-columns:24px 16px minmax(0,1fr) auto;gap:0 6px;align-items:baseline;width:100%;padding:3px 12px 3px 10px}
.pl:hover{background:var(--p)}
.pl .n{color:var(--faint);font-size:12px}
.pl .gl{color:var(--c,var(--faint))}
.pl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.f-done{--c:var(--green)} .f-done .nm{color:var(--dim)}
.f-todo .nm{color:var(--text)}
.f-cur{--c:var(--amber);border-left-color:var(--amber)!important;background:color-mix(in srgb,var(--amber) 7%,var(--bg))}
.f-cur .pl .nm{color:var(--text);font-weight:700}
li.open .pl .nm{white-space:normal;overflow-wrap:anywhere}
li.open{border-left-color:var(--line2)}
.pnote{padding:2px 12px 10px 56px;color:var(--dim);font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.pnote .gr{margin-top:4px;color:var(--text)} .pnote .gr .meta{font-size:11.5px}
.pnote .st{color:var(--amber);font-size:11.5px;margin-bottom:2px}
.sum{color:var(--green)} .sum .nm{color:var(--green)!important}
.lgd{border-top:1px solid var(--line);padding:7px 12px 8px;color:var(--faint);font-size:11.5px;display:flex;flex-wrap:wrap;gap:2px 14px}

.now{border-color:var(--line2)}
.now dl{display:grid;grid-template-columns:84px minmax(0,1fr);gap:0 14px}
.now dt{color:var(--faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:8px 0;border-bottom:1px solid #1C2027}
.now dd{padding:6px 0 7px;border-bottom:1px solid #1C2027;min-width:0;overflow-wrap:anywhere}
.now dt:nth-last-of-type(1),.now dd:last-of-type{border-bottom:0}
.now .cp{font-weight:700;font-size:14px} .now .cp b{color:var(--amber);margin-right:8px}
.now .cps{color:var(--amber);font-size:12px;margin-left:10px;font-weight:400}
.now .next{color:var(--amber)}
.now li+li,.inb li+li{margin-top:6px}
.gw .r{color:var(--dim)} .gw .r::before{content:"└ ";color:var(--faint)}
.msg .mt{display:flex;gap:8px;width:100%;align-items:baseline}
.msg .mt .t{font-weight:700;color:var(--text);min-width:0}
.msg .mt .ch{color:var(--faint);flex:none}
.msg.read .mt .t{font-weight:400;color:var(--dim)}
.msg .mt:hover .t{color:var(--amber)}
.msg .mt .dot{color:var(--amber);flex:none}
.msg pre{font:inherit;font-size:12px;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--p);border-left:3px solid var(--amber);padding:8px 10px;margin:4px 0 2px;max-height:190px;overflow-y:auto}

#it col.c1{width:92px} #it col.c3{width:76px} #it col.c4{width:64px}
#it td{padding:5px 12px 5px 0}
#it .tb{display:block;width:100%;color:var(--text)}
#it .tb:hover{color:var(--amber)}
#it .det{color:var(--dim);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.is-open{color:var(--text)} .is-planned{color:var(--amber)} .is-done{color:var(--green)} .is-discarded{color:var(--faint);text-decoration:line-through}
.dec{display:grid;grid-template-columns:96px minmax(0,1fr);gap:0 14px}
.dec time{color:var(--faint)}
.dec .d{overflow-wrap:anywhere}
.dec .r{grid-column:2;color:var(--dim);margin-bottom:8px;overflow-wrap:anywhere}
.dec .r::before{content:"└ because ";color:var(--faint)}
.more{color:var(--dim);margin-top:4px} .more:hover{color:var(--amber)}

@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)} .ledger{position:static;max-height:none}
  #pt col.c4,#pt col.c5{width:auto}}
</style>
</head>
<body>
<nav class="bar" aria-label="views">
  <a class="logo" href="#overview">project-hub</a>
  <a class="tab" id="tab-ov" href="#overview"><kbd>1</kbd>overview</a>
  <a class="tab" id="tab-p" href="#overview"><kbd>2</kbd><span></span></a>
  <span class="sp"></span>
  <span class="st" id="bar-wait"></span>
  <span class="st" id="bar-snap"></span>
</nav>
<main>
  <section class="view" id="overview" aria-label="overview"></section>
  <section class="view" id="project" aria-label="project"></section>
</main>
<div class="foot" role="toolbar" aria-label="shortcuts">
  <button data-act="go-ov"><kbd>1</kbd>overview</button>
  <button data-act="go-p"><kbd>2</kbd>project</button>
  <button data-act="done" data-pv><kbd>e</kbd>show done phases</button>
  <button data-act="cycle" data-pv><kbd>f</kbd>cycle item filter</button>
</div>
<script src="redesign/data.js"></script>
<script>
(function(){
const H = window.HUB;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const now = Date.parse(H.snapshot);
const ago = t => { const m = Math.max(0, Math.round((now - Date.parse(t)) / 60000));
  return m < 1 ? "now" : m < 60 ? m + "m" : m < 1440 ? Math.round(m / 60) + "h" : Math.round(m / 1440) + "d"; };
const left = t => { const m = Math.round((Date.parse(t) - now) / 60000); return m <= 0 ? "expired" : m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m"; };
const byId = id => H.projects.find(p => p.id === id);

// hub rules (from the brief)
const curIdx = p => { const i = p.phases.findIndex(f => f.status === "in_progress"); return i >= 0 ? i : p.phases.findIndex(f => f.status === "todo"); };
const waiting = f => f.gate === "manual_test" || (f.gate === "review" && !f.gate_approved);
const forP = (m, id) => m.to_project === id || m.to_project === "all";
const reports = id => H.messages.filter(m => m.kind === "report" && m.status === "unread" && forP(m, id));
const tasks = id => H.messages.filter(m => m.kind === "task" && m.status !== "done" && m.to_project === id);
const gates = p => p.phases.map((f, i) => ({f, i})).filter(x => waiting(x.f));
const waitCount = p => gates(p).length + reports(p.id).length + tasks(p.id).length;
const ITEMS = 12;
const TYPE = {bug: "bug", idea: "idea", future_request: "request"};
const gateWord = f => f.gate === "manual_test" ? "manual test" : f.gate_approved ? "approved" : "review";
const gateBadge = f => !f.gate ? "" : `<span class="gb g-${waiting(f) ? f.gate : "ok"}" title="gate: ${gateWord(f)}">${f.gate === "manual_test" ? "test" : f.gate_approved ? "ok" : "review"}</span>`;
const strip = p => { const c = curIdx(p);
  return `<span class="strip" aria-hidden="true">${p.phases.map((f, i) => `<i class="${f.status === "done" ? "d" : i === c ? "c" : ""}${waiting(f) ? " w" : ""}"></i>`).join("")}</span>`; };
const doneN = p => p.phases.filter(f => f.status === "done").length;

// view state
const S = {last: null, done: false, open: new Set(), filter: "all", closed: false, decAll: false, items: new Set(), msgs: new Set()};

function msgRow(m, showKind){
  const o = S.msgs.has(m.id), unread = m.status === "unread";
  return `<li class="msg ${unread ? "unread" : "read"}">
    <button class="mt" data-act="msg" data-id="${esc(m.id)}" aria-expanded="${o}" data-k="m${esc(m.id)}">
      ${showKind ? `<span class="kind k-${m.kind === "message" ? "msg" : esc(m.kind)}">${m.kind === "message" ? "msg" : esc(m.kind)}</span>` : ""}
      ${unread ? `<span class="dot" aria-label="unread">●</span>` : ""}
      <span class="t ${o ? "wrap" : "clamp1"}">${esc(m.title)}</span>
      <span class="ch">${esc(m.from_project)} → ${esc(m.to_project)} · ${ago(m.created_at)} ${o ? "▾" : "▸"}</span>
    </button>${o ? `<pre>${esc(m.body)}</pre>` : ""}</li>`;
}

/* ---------- overview ---------- */
function overview(){
  const rows = [];
  for (const p of H.projects) for (const {f, i} of gates(p))
    rows.push({o: 0, kind: f.gate === "manual_test" ? `<span class="kind k-gate">test</span>` : `<span class="kind k-review">review</span>`,
      p, what: `<b class="meta" style="font-weight:400">${pad(i + 1)}</b> ${esc(f.name)}`, why: esc(f.gate_reason || (f.gate === "manual_test" ? "manual test by you" : "needs your approval")),
      who: "set by " + esc(f.gate_set_by || "—")});
  for (const m of H.messages) {
    const isTask = m.kind === "task" && m.status !== "done", isRep = m.kind === "report" && m.status === "unread";
    if (!isTask && !isRep) continue;
    const pid = byId(m.to_project) ? m.to_project : byId(m.from_project) ? m.from_project : null;
    rows.push({o: isTask ? 1 : 2, kind: `<span class="kind k-${isTask ? "task" : "report"}">${isTask ? "task" : "report"}</span>`,
      p: byId(pid), to: m.to_project, what: esc(m.title), why: esc(m.body.split("\n").find(l => l.trim()) || ""),
      who: esc(m.from_project) + " · " + ago(m.created_at)});
  }
  rows.sort((a, b) => a.o - b.o);
  const wt = rows.map(r => `<tr>
    <td>${r.kind}</td>
    <td class="clamp1">${r.p ? `<a href="#p/${esc(r.p.id)}">${esc(r.p.name)}</a>` : esc(r.to)}${r.to === "all" ? ` <span class="meta">→ all</span>` : ""}</td>
    <td><div class="clamp1">${r.p ? `<a class="what" href="#p/${esc(r.p.id)}">${r.what}</a>` : `<span class="what">${r.what}</span>`}</div><div class="why clamp1">${r.why}</div></td>
    <td class="meta clamp1">${r.who}</td>
    <td>${r.p ? `<a class="lnk meta" href="#p/${esc(r.p.id)}" aria-label="open ${esc(r.p.name)}">open ›</a>` : ""}</td></tr>`).join("");
  const pt = H.projects.map(p => { const c = curIdx(p), f = p.phases[c], w = waitCount(p);
    return `<tr>
      <td><span class="tag s-${esc(p.status)}">${esc(p.status)}</span></td>
      <td><div class="nm clamp1"><a href="#p/${esc(p.id)}">${esc(p.name)}</a></div><div class="desc clamp1" title="${esc(p.description)}">${esc(p.description)}</div></td>
      <td>${strip(p)}<span class="frac">${doneN(p)}/${p.phases.length}</span></td>
      <td class="ph">${f ? `<div class="clamp1"><b>${pad(c + 1)}</b>${esc(f.name)}</div><div class="meta">${f.status === "in_progress" ? `<span style="color:var(--amber)">▶ in progress</span>` : "○ next up"} ${gateBadge(f)}</div>` : `<span class="meta">all done</span>`}</td>
      <td class="nx"><div class="clamp2">${esc(p.next_step) || "—"}</div></td>
      <td>${w ? `<span class="badge">${w}</span>` : `<span class="zero">0</span>`}</td>
      <td class="meta">${ago(p.updated_at)}</td></tr>`; }).join("");
  const rs = H.leases.map(l => `<tr><td class="clamp1">${esc(l.resource)}</td><td>${byId(l.project_id) ? `<a href="#p/${esc(l.project_id)}">${esc(l.project_id)}</a>` : esc(l.project_id)}</td><td class="clamp1">${esc(l.purpose)}</td><td class="meta">${left(l.expires_at)}</td></tr>`).join("");
  return `<p class="prompt"><b>danny@hub</b> ~ $ <i>whats_waiting</i> <span class="caret"></span></p>
  <div class="pane"><div class="lbl">waiting for you <span>${rows.length}</span></div>
    <div class="rt meta"><span><span class="kind k-gate" style="width:auto;padding:0 4px">test</span> manual test by you</span><span><span class="kind k-review" style="width:auto;padding:0 4px">review</span> approve to continue</span></div>
    ${rows.length ? `<table id="wt"><colgroup><col class="c1"><col class="c2"><col><col class="c4"><col class="c5"></colgroup>
      <thead><tr><th>kind</th><th>project</th><th>what</th><th>from</th><th></th></tr></thead><tbody>${wt}</tbody></table>` : `<p class="ok">✓ nothing waiting for you</p>`}
  </div>
  <div class="pane"><div class="lbl">projects <span>${H.projects.length}</span></div>
    <div class="rt meta"><span><span class="strip"><i class="d"></i></span> done</span><span><span class="strip"><i class="c"></i></span> current</span><span><span class="strip"><i class="w"></i></span> gate waiting</span></div>
    <table id="pt"><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col><col class="c6"><col class="c7"></colgroup>
    <thead><tr><th>status</th><th>project</th><th>phases</th><th>current phase</th><th>next step</th><th>waiting</th><th>updated</th></tr></thead><tbody>${pt}</tbody></table>
  </div>
  <div class="pane"><div class="lbl">resources <span>${H.leases.length}</span></div>
    ${rs ? `<table id="rt"><colgroup><col class="c1"><col class="c2"><col><col class="c4"></colgroup><thead><tr><th>resource</th><th>project</th><th>purpose</th><th>time left</th></tr></thead><tbody>${rs}</tbody></table>` : `<p class="empty">No active resources.</p>`}
  </div>`;
}

/* ---------- project ---------- */
function phaseLi(p, f, i, c){
  const isCur = i === c;
  const o = S.open.has(f.id) ? !isCur : isCur; // clicking the current phase collapses it
  const cls = isCur ? "f-cur" : "f-" + (f.status === "done" ? "done" : "todo");
  const glyph = f.status === "done" ? "✓" : isCur ? "▶" : "○";
  const st = isCur ? (f.status === "in_progress" ? "▶ in progress" : "○ next up") : f.status === "done" ? "✓ done" : "○ todo";
  return `<li class="${cls}${o ? " open" : ""}">
    <button class="pl" data-act="ph" data-id="${esc(f.id)}" aria-expanded="${o}" data-k="f${esc(f.id)}" title="${esc(f.name)}">
      <span class="n">${pad(i + 1)}</span><span class="gl" aria-label="${st}">${glyph}</span><span class="nm">${esc(f.name)}</span>${gateBadge(f)}</button>
    ${o ? `<div class="pnote">${isCur ? `<div class="st">${st}</div>` : ""}${f.notes ? esc(f.notes) : `<span class="empty">No notes.</span>`}
      ${f.gate ? `<div class="gr"><span class="gb g-${waiting(f) ? f.gate : "ok"}">${gateWord(f)} gate</span> ${esc(f.gate_reason || "")} <span class="meta">· set by ${esc(f.gate_set_by || "—")}</span></div>` : ""}</div>` : ""}</li>`;
}

function project(p){
  const c = curIdx(p), f = p.phases[c], dn = doneN(p);
  const hidden = p.phases.map((x, i) => ({x, i})).filter(({x}) => x.status === "done" && !waiting(x));
  const lis = [];
  if (hidden.length) lis.push(`<li><button class="pl sum" data-act="done" aria-expanded="${S.done}" data-k="sum"><span class="n"></span><span class="gl">✓</span><span class="nm">${hidden.length} done ${S.done ? "▾" : "▸"}</span></button></li>`);
  p.phases.forEach((x, i) => { if (S.done || !hidden.some(h => h.i === i)) lis.push(phaseLi(p, x, i, c)); });

  const g = gates(p), r = reports(p.id), t = tasks(p.id);
  const gw = g.length ? `<ul class="gw">${g.map(({f, i}) => `<li><span class="gb g-${f.gate}">${gateWord(f)}</span> <span class="meta">${pad(i + 1)}</span> <b>${esc(f.name)}</b>
      <div class="r">${esc(f.gate_reason || "")} <span class="meta">· set by ${esc(f.gate_set_by || "—")}</span></div></li>`).join("")}</ul>` : `<span class="ok">✓ none waiting</span>`;

  const items = p.items.slice().sort((a, b) => ["planned", "open", "done", "discarded"].indexOf(a.status) - ["planned", "open", "done", "discarded"].indexOf(b.status));
  const live = items.filter(x => x.status === "open" || x.status === "planned");
  const pool = S.closed ? items : live;
  const cnt = ty => pool.filter(x => ty === "all" || x.type === ty).length;
  const shown = pool.filter(x => S.filter === "all" || x.type === S.filter);
  const tog = (ty, word) => `<button class="tg" data-act="flt" data-ty="${ty}" aria-pressed="${S.filter === ty}" data-k="t${ty}">${word}<small>${cnt(ty)}</small></button>`;
  const rows = (S.itAll ? shown : shown.slice(0, ITEMS)).map(x => { const o = S.items.has(x.id);
    return `<tr><td><span class="ty ty-${esc(x.type)}">${TYPE[x.type] || esc(x.type)}</span></td>
      <td><button class="tb ${o ? "wrap" : "clamp1"}" data-act="it" data-id="${esc(x.id)}" aria-expanded="${o}" data-k="i${esc(x.id)}">${esc(x.title)}</button>${o ? `<div class="det">${esc(x.details) || "No details."} <span class="meta">#${esc(x.id)}</span></div>` : ""}</td>
      <td class="is-${esc(x.status)}">${esc(x.status)}</td><td class="meta">${ago(x.created_at)}</td></tr>`; }).join("");

  const decs = p.decisions.slice().reverse(), dshow = S.decAll ? decs : decs.slice(0, 4);
  const inbox = H.messages.filter(m => (forP(m, p.id) || m.from_project === p.id) && !r.includes(m) && !t.includes(m)) // Now pane already shows those.sort((a, b) => b.created_at.localeCompare(a.created_at));

  return `<header class="phead">
    <h2>${esc(p.name)}</h2><span class="tag s-${esc(p.status)}">${esc(p.status)}</span>
    <span>${strip(p)}<span class="frac">${dn}/${p.phases.length} phases done</span></span>
    <span class="repo clamp1" title="${esc(p.repo_path)}">repo <span>${esc(p.repo_path)}</span></span>
    <p class="desc clamp1" title="${esc(p.description)}">${esc(p.description)}</p>
  </header>
  <div class="split">
    <aside class="pane ledger" aria-label="phases"><div class="lbl">phases <span>${dn}/${p.phases.length} done</span></div>
      <ul>${lis.join("")}</ul>
      <div class="lgd"><span>✓ done</span><span style="color:var(--amber)">▶ now</span><span>○ to do</span><span class="gb g-manual_test" style="font-weight:400">test = you test</span><span class="gb g-review" style="font-weight:400">review = you approve</span></div>
    </aside>
    <div>
      <section class="pane now" aria-label="now"><div class="lbl">now</div>
        <dl>
          <dt>phase</dt><dd>${f ? `<span class="cp"><b>${pad(c + 1)}/${pad(p.phases.length)}</b>${esc(f.name)}</span><span class="cps">${f.status === "in_progress" ? "▶ in progress" : "○ next up"}</span> ${gateBadge(f)}` : `<span class="ok">✓ all phases done</span>`}</dd>
          <dt>next step</dt><dd class="next">${esc(p.next_step) || "—"}</dd>
          <dt>gates</dt><dd>${gw}</dd>
          <dt>reports</dt><dd>${r.length ? `<ul>${r.map(m => msgRow(m, false)).join("")}</ul>` : `<span class="ok">✓ no unread reports</span>`}</dd>
          ${t.length ? `<dt>tasks</dt><dd><ul>${t.map(m => msgRow(m, false)).join("")}</ul></dd>` : ""}
        </dl>
      </section>
      <section class="pane" aria-label="items"><div class="lbl">items <span>${live.length} open</span></div>
        <div class="rt">${tog("all", "all")}${tog("bug", "bugs")}${tog("idea", "ideas")}${tog("future_request", "requests")}
          <button class="tg" data-act="closed" aria-pressed="${S.closed}" data-k="closed">+closed<small>${items.length - live.length}</small></button></div>
        ${rows ? `<table id="it"><colgroup><col class="c1"><col><col class="c3"><col class="c4"></colgroup>
          <thead><tr><th>type</th><th>title</th><th>status</th><th>age</th></tr></thead><tbody>${rows}</tbody></table>${shown.length > ITEMS ? `<button class="more" data-act="itall" aria-expanded="${!!S.itAll}" data-k="itall">${S.itAll ? `show first ${ITEMS} ▴` : `all ${shown.length} ▸`}</button>` : ""}` : `<p class="empty">No items here.</p>`}
      </section>
      <section class="pane" aria-label="decisions"><div class="lbl">decisions <span>${decs.length}</span></div>
        ${decs.length ? `<div class="dec">${dshow.map(d => `<time>${esc(d.date.slice(0, 10))}</time><div class="d">${esc(d.decision)}</div><div class="r">${esc(d.reason)}</div>`).join("")}</div>
        ${decs.length > 4 ? `<button class="more" data-act="dec" aria-expanded="${S.decAll}" data-k="dec">${S.decAll ? "show latest 4 ▴" : `all ${decs.length} ▸`}</button>` : ""}` : `<p class="empty">No decisions.</p>`}
      </section>
      <section class="pane inb" aria-label="inbox"><div class="lbl">inbox <span>${inbox.length} more</span></div>
        ${inbox.length ? `<ul>${inbox.map(m => msgRow(m, true)).join("")}</ul>` : `<p class="empty">No messages.</p>`}
      </section>
    </div>
  </div>`;
}

/* ---------- routing + render ---------- */
function render(){
  const fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  const m = location.hash.match(/^#p\/(.+)$/), p = m && byId(decodeURIComponent(m[1]));
  if (p && S.last !== p.id) { S.last = p.id; S.done = false; S.open.clear(); S.filter = "all"; S.closed = false; S.decAll = false; S.itAll = false; S.items.clear();
    S.msgs = new Set(reports(p.id).slice(0, 1).map(x => x.id)); } // newest unread report opens by itself
  const tp = byId(S.last) || H.projects[0];
  $("#tab-p").href = "#p/" + tp.id; $("#tab-p span").textContent = tp.name;
  $("#tab-ov").classList.toggle("on", !p); $("#tab-p").classList.toggle("on", !!p);
  document.querySelectorAll("[data-pv]").forEach(b => b.hidden = !p);
  $("#overview").hidden = !!p; $("#project").hidden = !p;
  const w = H.projects.reduce((n, x) => n + gates(x).length + tasks(x.id).length, 0) + H.messages.filter(x => x.kind === "report" && x.status === "unread").length;
  $("#bar-wait").innerHTML = w ? `<b>${w} waiting</b>` : "nothing waiting";
  $("#bar-snap").textContent = "snapshot " + H.snapshot.slice(0, 16).replace("T", " ") + (/stress=1/.test(location.search) ? " · stress" : "");
  if (p) $("#project").innerHTML = project(p); else $("#overview").innerHTML = overview();
  document.title = (p ? p.name : "overview") + " · project-hub";
  if (fk) { const el = document.querySelector(`[data-k="${CSS.escape(fk)}"]`); if (el) el.focus(); }
}
function $(s){ return document.querySelector(s); }
const cycle = ["all", "bug", "idea", "future_request"];
function act(a, el){
  if (a === "go-ov") return void (location.hash = "#overview");
  if (a === "go-p") return void (location.hash = "#p/" + (S.last || H.projects[0].id));
  if (a === "ph") { const id = el.dataset.id; S.open.has(id) ? S.open.delete(id) : S.open.add(id); }
  else if (a === "done") S.done = !S.done;
  else if (a === "flt") S.filter = el.dataset.ty;
  else if (a === "cycle") S.filter = cycle[(cycle.indexOf(S.filter) + 1) % cycle.length];
  else if (a === "closed") S.closed = !S.closed;
  else if (a === "dec") S.decAll = !S.decAll;
  else if (a === "itall") S.itAll = !S.itAll;
  else if (a === "it") { const id = el.dataset.id; S.items.has(id) ? S.items.delete(id) : S.items.add(id); }
  else if (a === "msg") { const id = el.dataset.id; S.msgs.has(id) ? S.msgs.delete(id) : S.msgs.add(id); }
  render();
}
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el) act(el.dataset.act, el); });
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = {"1": "go-ov", "2": "go-p", e: "done", f: "cycle"}[e.key];
  if (k && (k.startsWith("go") || location.hash.startsWith("#p/"))) { e.preventDefault(); act(k, e.target); }
});
window.addEventListener("hashchange", render);
render();
})();
</script>
</body>
</html>
